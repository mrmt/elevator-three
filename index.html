    }
    try{ localStorage.removeItem(MIX_STORE); }catch(_){ }
    solo.clear(); mute.clear(); refreshSoloMute();   // SOLO / MUTE も解除する (two:D-59)
    // 陰陽はシーンの位置に戻したので、手で触った印も外して波に返す
    sceneEdited=false; updateScene(); highlightScene();
  });
}

function markEdited(){
  sceneBtns.forEach(b=>b.setAttribute('aria-pressed','false'));
  if(!sceneEdited){ sceneEdited=true; updateScene(); }
}

/* ---- ステップ列 ---- */
const stepsEl=document.getElementById('steps');
for(let i=0;i<16;i++) stepsEl.appendChild(document.createElement('i'));
function renderSteps(){
  const cells=stepsEl.children;
  for(let i=0;i<16;i++){
    const on = (seq.kick[i]||0)>0 || (seq.snare[i]||0)>0 || (seq.clap[i]||0)>0;
    const hat = (seq.hat[i]||0)>0 || (seq.ohat[i]||0)>0;
    cells[i].className=(i%4===0?'beat ':'')+(on?'on ':hat?'hat ':'')+(i===uiStep?'now':'');
  }
}
renderSteps();

/* ---- 進行の表示 ---- */
const pPhrase=document.getElementById('pphrase');
const pBarPos=document.getElementById('pbarpos');
const pEvent=document.getElementById('pevent');
const pWave=document.getElementById('pwave');
const pKey=document.getElementById('pkey');
const pChord=document.getElementById('pchord');
const pJev=document.getElementById('pjev'), pJevD=document.getElementById('pjevd');
renderJevLog();   // jev=0 のときはその旨を出す (D-11)
function showProgress(){
  pPhrase.textContent=(PHRASE_LABEL[phrase]||phrase)
    + (pendingScene>=0
        ? ` → ${SCENES[pendingScene].id} (${transitionMode})`
        : '');
  const inPhrase=barCount-phraseStartBar+1;
  const inScene=barCount-sceneStartBar+1;
  // いまの小節の装飾。ダブを先に見る (ダブの小節ではオカズは置き直されている)
  const deco = dubBar===barCount ? '  dub' : curFillBar ? '  fill' : '';
  // リフが出た小節は置き場所の型を出す (two:D-74)。オカズと同居しうるので deco の三項には混ぜない
  const rf = sparkLabelBar===barCount ? `  riff ${sparkLabel}` : '';
  pBarPos.textContent=`${inPhrase}/${PHRASE_BARS}  (scene ${inScene}/${sceneBars})${deco}${rf}${loopBar?'  loop':''}`;
  // 点滅 (two:D-62)。シーンが変わる直前の小節のシーン名と、押してから乗り換わるまでの next
  sceneNameEl.classList.toggle('blink', running && pendingScene>=0 && barCount===transitionEndBar-1);
  nextBtn.classList.toggle('blink', running && nextPending && pendingScene>=0);
  pEvent.textContent = lastEventBar<0 ? '—'
    : `${EVENT_LABEL[lastEvent]||lastEvent}  @bar ${lastEventBar}`;
  const yy=waveYY(wavePos);
  pWave.textContent=`${yy.toFixed(2)}  ${(wavePos*100).toFixed(0)}%  / ${Math.round(wavePeriod/60)}min`;
  pKey.textContent=`${NOTE_NAMES[tonic()]} ${MODE_LABEL[SCENES[sceneIdx].group]}${shiftOff ? ' '+(shiftOff>0?'+':'')+shiftOff : ''}`;
  const q=(Q_LABEL[chordQual]||chordQual)
    + (chordBassDeg!=null ? '/'+NOTE_NAMES[(tonic()+chordBassDeg)%12] : '');
  const mode = (circuit()==='sustain'||circuit()==='funk') && padChop ? ' chop' : '';
  // ノイズ層の周期も出す。ポリリズムがどう回っているかはここでしか分からない
  const nz = noiseOn ? '  ' + 'noise ' + noiseGens.map(g=>g.len).join('/') : '';
  // ベースの音符数と、疎なときに掛かるフェーザー (two:D-39)
  const bs = `  bass ${bassNotes}`
    + (bassSparse()?' +phaser':'')
    + (bassWobble?' +wobble':'')
    + (bassMod?' +vibrato':'')
    + (barCount<pedalUntilBar?' +pedal':'');
  // Jev (D-9)。状態と応答時間、Jev と手元で決めた数、直近に Jev が決めたこと
  pJev.textContent = JEV_OFF || target.jev<=0 ? 'off' : jev.status+(jev.ms!=null ? ` ${jev.ms}ms` : '');
  pJevD.textContent = `${jev.used} jev / ${jev.local} local${jev.last ? '  '+jev.last : ''}`;
  pChord.textContent=`${NOTE_NAMES[(tonic()+chordDeg)%12]}${q}  [${CIRCUIT_LABEL[circuit()]}${lushOn?' lush':''}${mode}${epGuest?' + ep':''}]${bs}${nz}`;
}

/* ---- monitor の波形 (two:D-36 / two:D-61) ----
   帯を塗り、いま出ている波形と拍の明滅を描く */
const cv=document.getElementById('cv'), g2=cv.getContext('2d');
function resize(){
  const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1;
  cv.width=Math.max(1,Math.round(r.width*d));
  cv.height=Math.max(1,Math.round(r.height*d));
  g2.setTransform(d,0,0,d,0,0);
}
new ResizeObserver(resize).observe(cv);
window.addEventListener('resize',resize);
resize();

/* ---- 発音インジケーター (two:D-82) ---- */
function addLed(label,key){
  const led=document.createElement('i'); led.className='led'; led.id='led_'+key;
  label.insertBefore(led, label.querySelector('.val'));
  leds[key]=led;
}
function ledRow(host,key,text,tip){
  const wrap=document.createElement('div'); wrap.className='param ledonly';
  const lab=document.createElement('label');
  const name=document.createElement('span'); name.textContent=text; name.dataset.tip=tip;
  lab.append(name); addLed(lab,key);
  wrap.append(lab); host.appendChild(wrap);
}
/* 描画のたびに、音声時計でいま鳴っているキーを灯す。状態が変わった要素だけ触る。
   strings の持続音は1音ずつの予約が無いので、apply() と同じ条件で「開いているか」を見る */
function updateLeds(){
  const now = (ctx && running) ? ctx.currentTime : -1;
  for(const key in leds){
    let on=false;
    if(now>=0){
      const a=voiceSpans[key];
      if(a && a.length){
        voiceSpans[key]=a.filter(s=>s.end>=now);
        on=voiceSpans[key].some(s=>s.start<=now);
      }
      if(!on && key==='strings')
        on = lv('strings')>0 && (circuit()==='sustain' || circuit()==='funk') && padLayers()>=1 && !padChop;
    }
    const led=leds[key];
    if(led._on!==on){ led.classList.toggle('on',on); led._on=on; }
  }
}

function draw(){
  requestAnimationFrame(draw);
  updateLeds();   // キャンバスが隠れている (狭い画面の別タブ) ときも回す
  const w=cv.clientWidth, h=cv.clientHeight;
  if(!w||!h) return;
  g2.fillStyle='#050506'; g2.fillRect(0,0,w,h);

  // 波形。いま出ている音をそのまま横に引き伸ばして描く。
  // 立ち上がりが左端に来るよう、上りのゼロ交差を探して起点にする
  if(scope && running){
    scope.getFloatTimeDomainData(scopeBuf);
    const n=scopeBuf.length;
    let start=0;
    for(let i=1;i<n>>1;i++){
      if(scopeBuf[i-1]<=0 && scopeBuf[i]>0){ start=i; break; }
    }
    const span=Math.min(n-start, n>>1);
    g2.beginPath();
    for(let x=0;x<w;x++){
      const v=scopeBuf[start+Math.floor(x/w*span)]||0;
      const y=h/2 - v*h*.42;
      x ? g2.lineTo(x,y) : g2.moveTo(x,y);
    }
    g2.strokeStyle=scopeColor();
    g2.lineWidth=1.4;
    g2.stroke();
  }

  // 拍の明滅。無音の段階でも拍が見えるようにしておく
  if(uiStep>=0 && uiStep%4===0){
    g2.fillStyle=`rgba(216,163,64,${.05+ (uiStep===0?.05:0)})`;
    g2.fillRect(0,0,w,h);
  }
}
draw();

// 波形の色。テーマを変えたときに拾い直す
let scopeColorCache='';
function scopeColor(){ return scopeColorCache || 'rgba(216,163,64,.7)'; }

/* ---- 読み出し ---- */
const rBPM=document.getElementById('rbpm'), rBar=document.getElementById('rbar');
function readout(){
  rBPM.textContent=Math.round(bpmNow());
  rBar.textContent=running ? String(barCount-sceneStartBar+1) : '—';
  // 陰陽は波やシーン選択でも動く。掴んでいないときはスライダーを目標へ追従させる
  const yyIn=inputs.yy;
  if(!dragging && Math.abs(parseFloat(yyIn.value)-target.yy)>.004){ yyIn.value=target.yy; yyIn.show(); }
}

/* ============================================================
   バックグラウンド再生
   ------------------------------------------------------------
   iOS の Safari は画面ロックやバックグラウンド遷移で2つの止め方をしてくる。

   1. AudioContext 自体が中断される
      → 出力を MediaStreamDestination 経由で <audio> 要素に流し、
        ページを「メディア再生中」として扱わせる
   2. setInterval / setTimeout が絞られて止まる
      → 進行の時計を AudioWorklet に移す。音声スレッドで回るので絞られない

   どちらも対応していない環境では ctx.destination と setInterval に戻る。
   elevator-one で作った仕組みをそのまま引き継いでいる (two:D-2)。
   ============================================================ */
const CLOCK_SRC=`
class ClockProcessor extends AudioWorkletProcessor {
  constructor(){ super(); this.n=0; }
  process(){
    if(++this.n>=8){ this.n=0; this.port.postMessage(0); }   // 128フレーム × 8
    return true;
  }
}
registerProcessor('clock', ClockProcessor);
`;

let clockNode=null, sink=null, sinkActive=false, fallbackTimer=null;

function tick(){
  if(!ctx) return;
  if(performance.now()-smoothAt>=100) smooth();   // 平滑化とUI更新は100ms間隔で十分
  runStepUI(ctx.currentTime);
  runDisposals(ctx.currentTime);   // 止めたあとも鳴り終わりの片付けだけは続ける
  if(!running) return;
  seqTick();
}

async function startClock(){
  if(clockNode) return;
  if(ctx.audioWorklet){
    const url=URL.createObjectURL(new Blob([CLOCK_SRC],{type:'text/javascript'}));
    try{
      await ctx.audioWorklet.addModule(url);
      // Ladder も同じ入口で読む。こちらが失敗してもクロックは動かす
      try{
        const lurl=URL.createObjectURL(new Blob([LADDER_SRC],{type:'text/javascript'}));
        try{ await ctx.audioWorklet.addModule(lurl); ladderReady=true; }
        finally{ URL.revokeObjectURL(lurl); }
      }catch(e){ ladderReady=false; }
      clockNode=new AudioWorkletNode(ctx,'clock',{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});
      clockNode.port.onmessage=tick;
      clockNode.connect(comp);   // 繋がないと process が呼ばれない。出力は無音なので混ざらない
      return;
    }catch(e){
      clockNode=null;
    }finally{
      URL.revokeObjectURL(url);
    }
  }
  clearInterval(fallbackTimer); fallbackTimer=setInterval(tick,25);
}

// 再生が実際に進み始めたかを最大1.5秒待って見る
async function sinkAdvances(){
  const t0=sink.currentTime;
  for(let i=0;i<15;i++){
    await new Promise(r=>setTimeout(r,100));
    if(sink.currentTime>t0) return true;
  }
  return false;
}

async function routeToSink(){
  if(sinkActive){
    if(sink.paused) try{ await sink.play(); }catch(e){}
    return true;
  }
  if(!sink){
    sink=document.createElement('audio');
    sink.setAttribute('playsinline','');
    sink.autoplay=true;
    sink.srcObject=streamDest.stream;
    sink.addEventListener('pause',()=>reviveAudio());
    sink.addEventListener('ended',()=>reviveAudio());
    document.body.appendChild(sink);
  }
  try{
    out.disconnect(ctx.destination);   // 二重に鳴らさないため先に切る
    await sink.play();
    if(await sinkAdvances()){
      sinkActive=true;
      if(!running) sink.pause();
      return true;
    }
  }catch(e){ /* 下のフォールバックへ */ }
  try{ sink.pause(); }catch(e){}
  out.connect(ctx.destination);
  return false;
}

// ロック画面 / コントロールセンター / CarPlay には現在のシーンを出す
function mediaMetadata(){
  return new MediaMetadata({title:sceneLabel(), artist:`Elevator Three ${VERSION}`});
}
function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.metadata=mediaMetadata();
    navigator.mediaSession.setActionHandler('play', ()=>{ startAudio(); });
    navigator.mediaSession.setActionHandler('pause',stopAudio);
    // 「次へ」はロック画面からも押せるようにする
    navigator.mediaSession.setActionHandler('nexttrack',()=>{ newWavePeriod(); enterScene(chooseScene()); });
  }catch(e){}
}
function updateMediaMetadata(){
  if(!('mediaSession' in navigator) || !navigator.mediaSession.metadata) return;
  try{ navigator.mediaSession.metadata=mediaMetadata(); }catch(e){}
}

function reviveAudio(){
  if(!running || !ctx) return;
  if(ctx.state!=='running') ctx.resume().catch(()=>{});
  if(sinkActive && sink && sink.paused) sink.play().catch(()=>{});
}
document.addEventListener('visibilitychange',reviveAudio);
setInterval(reviveAudio,4000);

/* ---- 再生 / 一時停止 ---- */
const playBtn=document.getElementById('play');
const pauseBtn=document.getElementById('pause');
const bigPlay=document.getElementById('bigplay');
const startEl=document.getElementById('start');

function setPowerUI(on){
  startEl.hidden=on;   // 止まっている間だけ、大きなボタンと READ ME FIRST を出す (Issue #1 / two:D-72)
  playBtn.dataset.on=on?'1':'0';
  pauseBtn.dataset.on=on?'0':'1';
  playBtn.setAttribute('aria-pressed',on?'true':'false');
  pauseBtn.setAttribute('aria-pressed',on?'false':'true');
}
setPowerUI(false);

async function startAudio(){
  if(running) return;
  if(navigator.audioSession) try{ navigator.audioSession.type='playback'; }catch(e){}
  if(!ctx) build();
  await ctx.resume();
  running=true;
  setPowerUI(true);
  stepIdx=0; barCount=0; nextStepTime=ctx.currentTime+.12; barBuilt=false;
  phraseStartBar=0; sceneStartBar=0; phraseLen=PHRASE_BARS;
  sceneBars=sceneLengthBars();
  muteHatUntilBar=-1; muteKickUntilBar=-1; glitchBar=-1;
  pendingScene=-1; transitionEndBar=-1; seqB=null;
  evFilterUntil=0; evMasterUntil=0; evDelayUntil=0;
  bpmCur=bpmTarget();
  await startClock();
  ensureBass();   // Ladder の読み込み結果が要るので、時計のあとに組む
  routeToSink().catch(()=>{});   // 完了を待たない
  setupMediaSession();
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='playing';
}

function stopAudio(){
  if(!running) return;
  running=false;
  setPowerUI(false);
  muteHatUntilBar=-1; muteKickUntilBar=-1; glitchBar=-1; epGuest=false;
  pendingScene=-1; transitionEndBar=-1; seqB=null; pendingSpill=null; sparkSpill=null;
  sparkMotif=null; sparkAnswerAt=-1;   // リフのモチーフと応答も持ち越さない (two:D-75)
  for(const k in voiceSpans) voiceSpans[k].length=0;   // 予約済みの発音も消して、インジケーターを落とす (two:D-82)
  evLeadUntil=0; nextPending=false;
  if(phaserWet){ phaserWet.gain.cancelScheduledValues(ctx.currentTime); phaserWet.gain.setValueAtTime(0,ctx.currentTime); }
  if(drumMixB) endMixFades(ctx.currentTime);
  flushSteps();
  uiStep=-1; renderSteps();
  apply();
  if(sink) sink.pause();
  if('mediaSession' in navigator) navigator.mediaSession.playbackState='paused';
  showProgress();   // 点滅を止める (two:D-62)
}

playBtn.addEventListener('click',()=>{ startAudio(); });
bigPlay.addEventListener('click',()=>{ startAudio(); });
pauseBtn.addEventListener('click',stopAudio);

/* ---- タブ切替 (狭幅時のみ表示) ---- */
const mainEl=document.getElementById('main');
const tabBtns=[...document.querySelectorAll('#tabs .tab')];
tabBtns.forEach(b=>b.addEventListener('click',()=>{
  mainEl.dataset.tab=b.dataset.tab;
  tabBtns.forEach(o=>o.setAttribute('aria-selected',String(o===b)));
  resize(); // display:none 明けの canvas を再計測
}));

/* ---- ツールチップ ---- */
const tipEl=document.getElementById('tip');
let tipHost=null;
const TIP_LIFE_MS=5000;
let tipTimer=0;
function showTip(el){
  const txt=el.dataset.tip;
  if(!txt) return;
  clearTimeout(tipTimer);
  tipEl.classList.remove('fade');
  tipHost=el; tipEl.textContent=txt; tipEl.classList.add('on');
  const r=el.getBoundingClientRect();
  const tw=tipEl.offsetWidth, th=tipEl.offsetHeight;
  let x=r.left, y=r.bottom+8;
  if(y+th>innerHeight-8) y=Math.max(8, r.top-th-8);
  if(x+tw>innerWidth-10) x=innerWidth-tw-10;
  if(x<8) x=8;
  tipEl.style.left=x+'px'; tipEl.style.top=y+'px';
  tipTimer=setTimeout(fadeTip, TIP_LIFE_MS);
}
function fadeTip(){ tipHost=null; tipEl.classList.add('fade'); tipEl.classList.remove('on'); }
function hideTip(){ clearTimeout(tipTimer); tipHost=null; tipEl.classList.remove('on','fade'); }
const nearest=node=>(node && node.closest) ? node.closest('[data-tip]') : null;
document.addEventListener('mouseover',e=>{ const el=nearest(e.target); if(el&&el!==tipHost) showTip(el); });
document.addEventListener('mouseout', e=>{ const el=nearest(e.target); if(el&&el===tipHost) hideTip(); });
document.addEventListener('focusin',  e=>{ const el=nearest(e.target); if(el) showTip(el); });
document.addEventListener('focusout', hideTip);
window.addEventListener('blur', hideTip);

/* 初期シーンは波の位置 (陰寄り) から引く。ただし stab / dark の群は避ける (two:D-80)。
   単調なので、そこから始まると最初の数分の体験が良くない。
   波が陰寄りなので避けないと候補が stab に偏り、20回中6回 stab から始まっていた */
wavePos=yyToWavePos(P.yy.def);
newWavePeriod();
enterScene(chooseScene({avoid:'stab'}));
pickProg();
sceneBars=sceneLengthBars();
readLook();
updateScene();
showProgress();
readout();

window.addEventListener('keydown',e=>{
  if(e.code==='Space'&&e.target===document.body){ e.preventDefault(); if(running) stopAudio(); else startAudio(); }
});

})();
</script>
