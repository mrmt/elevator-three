  decayTo(g.gain,t,v*.42,.30);
  o.connect(g).connect(p); o.start(t); o.stop(t+.4);
  disposeAt(o,t+.45); disposeAt(g,t+.45); disposeAt(p,t+.45);
}

// リム: ごく短い矩形波の打点
function rim(t,v,pan){
  v*=lv('rim'); if(v<=0) return;   // 個別の音量と SOLO / MUTE (two:D-54 / two:D-59)
  markVoice('rim',t,t+.06);
  const o=ctx.createOscillator(), g=ctx.createGain(), p=drumOut(pan);
  o.type='square'; o.frequency.value=rand(1500,1900);
  decayTo(g.gain,t,v*.20,.028);
  o.connect(g).connect(p); o.start(t); o.stop(t+.06);
  disposeAt(o,t+.1); disposeAt(g,t+.1); disposeAt(p,t+.1);
}

// パーカッション。キットに応じて3通りに作り分ける (two:D-3 の「FM も有効」はここ)
function perc(t,v,pan,tone){
  v*=lv('perc'); if(v<=0) return;   // 個別の音量と SOLO / MUTE (two:D-54 / two:D-59)
  const k=kit();
  markVoice('perc',t,t+(k.perc==='fm' ? .3 : (k.perc==='metal' ? .12 : .09)+.05));
  if(k.perc==='fm'){
    const car=ctx.createOscillator(), mod=ctx.createOscillator(),
          md=ctx.createGain(), g=ctx.createGain(), p=drumOut(pan);
    car.type='sine'; mod.type='sine';
    const f=220*Math.pow(2,tone);
    car.frequency.value=f; mod.frequency.value=f*2.47;
    md.gain.value=f*3.2;
    mod.connect(md).connect(car.frequency);
    decayTo(g.gain,t,v*k.percGain*.5,.18);
    car.connect(g).connect(p);
    car.start(t); mod.start(t); car.stop(t+.3); mod.stop(t+.3);
    disposeAt(car,t+.35); disposeAt(mod,t+.35); disposeAt(md,t+.35);
    disposeAt(g,t+.35); disposeAt(p,t+.35);
    return;
  }
  const n=ctx.createBufferSource(), f=ctx.createBiquadFilter(), g=ctx.createGain(), p=drumOut(pan);
  n.buffer = k.perc==='metal' ? metalBuf : noiseBuf; n.loop=true;
  n.playbackRate.value=Math.pow(2,tone);
  f.type='bandpass'; f.frequency.value=800*Math.pow(2,tone+1); f.Q.value=k.perc==='metal'?2.2:1.0;
  const dec = k.perc==='metal' ? .12 : .09;
  decayTo(g.gain,t,v*k.percGain*.45,dec);
  n.connect(f).connect(g).connect(p);
  n.start(t); n.stop(t+dec+.05);
  disposeAt(n,t+dec+.1); disposeAt(f,t+dec+.1); disposeAt(g,t+dec+.1); disposeAt(p,t+dec+.15);
}

/* ---- 現在値をオーディオに反映 ---- */
function apply(){
  if(!ctx || !ready) return;
  const tm=ctx.currentTime, T=.25, c=current;
  master.gain.setTargetAtTime(running ? volume/100 : 0, tm, T);

  // 押し出し: 飽和段の入りを持ち上げ、そのぶんを後段で戻す
  const drive=.55+c.drive*1.5;
  drumBus.gain.setTargetAtTime(drive,tm,T);
  build.drumPost.gain.setTargetAtTime(1/(.7+c.drive*.9),tm,T);

  // 空間: リバーブとディレイの量。ディレイはテンポに同期させる
  revGain.gain.setTargetAtTime(.12+c.space*.55,tm,T);
  const sd=stepDur();
  const dubbing = phrase==='dubout';
  // dub (two:D-49) が長さを奪っている間は触らない。ここで書き戻すと返しの間隔が戻ってしまう
  if(tm>evDelayUntil){
    delayNodes.tapL.d.delayTime.setTargetAtTime(sd*3,tm,1.2);    // 付点8分
    // 右は16分5つ。3と5はどちらも16分のグリッドに乗り、互いに素なので
    // 返しが拍とずれ続けて dub 的な絡みになる。グリッドから外すと打点が濁る
    delayNodes.tapR.d.delayTime.setTargetAtTime(sd*5,tm,1.2);
    delayNodes.tapL.fb.gain.setTargetAtTime(.28+c.space*.34+(dubbing?.22:0),tm,T);
    delayNodes.tapR.fb.gain.setTargetAtTime(.24+c.space*.32+(dubbing?.22:0),tm,T);
    // 出力も dub (two:D-49) が奪う。ここが dub の要なので取り合いにしない
    delayNodes.tapL.o.gain.setTargetAtTime(dlyOutL(),tm,T);
    delayNodes.tapR.o.gain.setTargetAtTime(dlyOutR(),tm,T);
  }
  build.drumSends.dly.gain.setTargetAtTime(.12+c.space*.35+(dubbing?.35:0),tm,T);
  build.drumSends.rev.gain.setTargetAtTime(.15+c.space*.5,tm,T);

  // ドラムのフィルタはフレーズ型で開き具合が変わる。
  // sweep イベントが動かしている間は触らない (取り合いになるため)
  if(tm>evFilterUntil){
    drumFilter.frequency.setTargetAtTime(phraseCutoff(),tm,T*2);
    drumFilter.Q.setTargetAtTime(1.0,tm,T);
  }
  if(tm>evMasterUntil) mixFilter.frequency.setTargetAtTime(20000,tm,T);

  // ベース (two:D-10)。押し出しが飽和の入りとレゾナンスを、重さが量と音域を決める
  if(bassReady){
    bassPre.gain.setTargetAtTime(.6+c.drive*1.9,tm,T);
    // 疎な小節はフェーザーを掛け、そのぶん量を1割下げる (two:D-39)
    const sparse=bassSparse();
    // 個別の音量 (two:D-54)。同じベースでも electro funk とそれ以外で別に持つ
    const bassMix = circuit()==='funk' ? lv('bassFunk') : lv('bass');
    bassBus.gain.setTargetAtTime((phrase==='break'?.15:1)*(.36+c.weight*.42)*(sparse?.9:1)*bassMix,tm,T);
    bassPhWet.gain.setTargetAtTime(sparse?.55:0,tm,T*3);
    const res=bassResParam();
    // 揺らしている間は1音ごとに書くので、こちらからは触らない (two:D-42)
    if(res && !bassWobble) res.setTargetAtTime(1.1+c.drive*1.5,tm,T);
    // Ladder 自身の入力も持ち上げる。各段の tanh が効きはじめ、倍音が増える
    const drv=bassDrvParam();
    if(drv) drv.setTargetAtTime(.9+c.drive*3.2,tm,T);
    bassComp.threshold.setTargetAtTime(-18-c.drive*12,tm,T);
    // うねりの速さと深さ。密度が上がるほど速く、陽へ寄るほど深く振れる
    bassLfo.osc.frequency.setTargetAtTime(.035+c.density*.14,tm,T);
    bassLfo.gain.gain.setTargetAtTime(
      bassCutoffBase()*(bassWobble?(.9+c.yy*1.3):(.25+c.yy*.5)),tm,T);
    build.bassSends.dly.gain.setTargetAtTime(.05+c.space*.22+(dubbing?.2:0),tm,T);
    build.bassSends.rev.gain.setTargetAtTime(.04+c.space*.14,tm,T);
  }

  // ハーモニー3回路。鳴らすのは基本的にどれかひとつ (two:D-8)。各バスの量には個別の音量 (two:D-54) を掛ける
  if(padBus){
    const cir=circuit(), L=padLayers();
    padBus.gain.setTargetAtTime((cir==='sustain'?.434:cir==='funk'?.28:0)*(.5+c.density*.5)*lv('strings'),tm,T*3);
    for(let i=0;i<4;i++){
      // 上の層ほど遅れて出る。剥がすときは速く落とす。
      // 連打のときは、持続音にあたる下2層を止めて代わりに連打が鳴る (two:D-34)
      const on = i<L && !(padChop && i<2);
      // 下2層が持続音、上2層がアルペジオと高域リフ。
      // 持続音は前に出すぎるので、上の層より低く敷く
      padLayer[i].gain.setTargetAtTime(on?(i<2?.55:.7):0, tm, on?T*4:T);
    }
    // 連打の量とディレイ。ディレイはテンポに同期させ、左右で16分3つと5つ
    chopBus.gain.setTargetAtTime(padChop?(.7*(.6+c.density*.5))*lv('chop'):0,tm,T*2);
    noiseBus.gain.setTargetAtTime(noiseOn?(.95+c.density*.6)*(phrase==='break'?.2:1)*lv('noise'):0,tm,T*2);
    build.noiseSends.dly.gain.setTargetAtTime(.1+c.space*.35,tm,T);
    chopDly.gain.setTargetAtTime(.45+c.space*.6,tm,T*2);
    chopTaps.l.d.delayTime.setTargetAtTime(sd*3,tm,1.2);
    chopTaps.r.d.delayTime.setTargetAtTime(sd*5,tm,1.2);
    padFilter.frequency.setTargetAtTime(700+c.yy*4200+(phrase==='build'?2200:0),tm,T*3);
    stabBus.gain.setTargetAtTime(cir==='stab'?(phrase==='break'?.16:.78)*lv('stab'):0,tm,T*2);
    stabFilter.frequency.setTargetAtTime(1200+c.yy*2600,tm,T*2);
    epBus.gain.setTargetAtTime((cir==='jazz'||epGuest)?.42*lv('ep'):0,tm,T*2);
    build.harmSends.stab.dly.gain.setTargetAtTime(.5+c.space*.6,tm,T);
    build.harmSends.pad.rev.gain.setTargetAtTime(.15+c.space*.4,tm,T);

    // 16分のシーケンス。盛り上げる局面ではステレオディレイを深くする (two:D-21)
    leadBus.gain.setTargetAtTime((phrase==='break'?.08:(.34+c.density*.3))*lv('lead'),tm,T*2);
    // フィルタは普段はゆっくり開き気味。イベントが動かしている間は触らない (two:D-29)
    if(tm>evLeadUntil){
      leadFilt.frequency.setTargetAtTime(leadCutoffBase(),tm,T*4);
      leadFilt.Q.setTargetAtTime(1,tm,T*2);
    }
    const lift = phrase==='build' ? .55 : phrase==='drop' ? .40 : phrase==='dubout' ? .30 : .10;
    leadDly.gain.setTargetAtTime(lift*(.5+c.space*.9),tm,T*3);
    const sd2=stepDur();
    leadTaps.l.d.delayTime.setTargetAtTime(sd2*3,tm,1.2);
    leadTaps.r.d.delayTime.setTargetAtTime(sd2*5,tm,1.2);
    for(const tp of [leadTaps.l,leadTaps.r])
      tp.fb.gain.setTargetAtTime(.30+lift*.35,tm,T*2);
  }
}

// 持続回路の層の数。build で1層ずつ積み上がり、drop で天井に達してから剥がれる (two:D-9)
function padLayers(){
  const c=circuit();
  if(c!=='sustain' && c!=='funk') return 0;
  if(phrase==='break') return 0;
  if(c==='funk') return 1;                     // funk では薄く敷くだけ (two:D-3)
  const u=clamp((barCount-phraseStartBar)/PHRASE_BARS);
  switch(phrase){
    case 'build':  return 1+Math.floor(u*3.99);
    case 'drop':   return 4;
    case 'dubout': return 1;
    default:       return 2;
  }
}

// フレーズ型ごとのドラムの開き具合。build は16小節かけて開いていく (two:D-9 のレイヤー累積に対応)
function phraseCutoff(){
  const u=clamp((barCount-phraseStartBar)/PHRASE_BARS);
  switch(phrase){
    case 'build':  return 900*Math.pow(20000/900,u);
    case 'break':  return 2600;
    case 'drop':   return 18000;
    case 'dubout': return 4200;
    default:       return 11000;
  }
}

/* ============================================================
   進行 — 第1層 シーン (two:D-4 / two:D-12 / two:D-13)
   ============================================================ */
let sceneIdx=0;          // いま鳴っているシーン
let pendingScene=-1;     // 遷移中の行き先
let transitionEndBar=-1;
let transitionMode='break';   // 'break' | 'morph' | 'mix' (two:D-5 の3方式)
/* 開発用。?transition=mix のように付けると遷移方式を固定できる。
   方式2と3は自動では数分に一度しか起きないので、手元での確認とテストに要る */
const QS=new URLSearchParams(location.search);
const forcedMode=(()=>{
  const v=QS.get('transition');
  return ['break','morph','mix'].includes(v) ? v : null;
})();
/* 開発用。?spark / ?dub を付けると、たまにしか出ない仕掛けを続けて出せる。
   値を 0〜1 で渡すとそれが確率になる。値なしなら必ず出す。
   リフ (two:D-48) は毎分1〜2回、ダブ (two:D-49) は32小節ごとに3割なので、
   素のままでは試聴に何分もかかる */
const qsRate=key=>{
  const v=QS.get(key);
  if(v===null) return null;
  const n=parseFloat(v);
  return Number.isFinite(n) ? clamp(n) : 1;
};
const forcedSpark=qsRate('spark'), forcedDub=qsRate('dub');
/* 開発用。?fill=tom / ?fill=snare でオカズの主役を固定する。
   素のままだとタムが出るまで待つことになり、テストが運と実時間に引きずられる。
   置き場所 (8小節ごと、小節の後ろ半分) は素のままなので、見ている性質は変わらない */
const forcedFill=(()=>{
  const v=QS.get('fill');
  return ['tom','snare'].includes(v) ? v : null;
})();
/* 開発用。?sparkrhythm=push でリフの置き場所の型を固定する (two:D-74)。
   引くところを固定するだけで、置く規則は素のまま。?spark と併用する前提。
   名前は SPARK_RHYTHMS と揃える (ここは定義より前なので直に参照できない) */
const forcedSparkRhythm=(()=>{
  const v=QS.get('sparkrhythm');
  return ['quarter','push','eighth','three','laid','syncope'].includes(v) ? v : null;
})();
/* 開発用。?sparkmotif で覚えた形を必ず使い直し、引退もさせない (two:D-75)。
   ?sparkmotif=0 なら必ず新しく引く。素のままだと再利用は5割なので、
   反復が狙いに聞こえるかループに落ちるかを聴き比べるのに待ちが入る */
const forcedSparkMotif=(()=>{
  const v=QS.get('sparkmotif');
  return v===null ? null : !(v==='0' || v==='false');
})();
/* 開発用。?sparkfold=high でリフの畳み先を固定する (two:D-76)。mid / high */
const forcedSparkFold=(()=>{
  const v=QS.get('sparkfold');
  return ['mid','high'].includes(v) ? v : null;
})();
/* 開発用。?sparkq=18 でリフのレゾナンスを dB で固定し、?sparkcut=2 でカットオフの
   倍率を固定する (two:D-77)。量の補正を対にして測るのに使う。
   qsRate は 0〜1 に丸めるので、ここは範囲を指定して読む */
const qsNum=(key,lo,hi)=>{
  const v=QS.get(key);
  if(v===null) return null;
  const n=parseFloat(v);
  return Number.isFinite(n) ? clamp(n,lo,hi) : null;
};
const forcedSparkQ=qsNum('sparkq',.5,18), forcedSparkCut=qsNum('sparkcut',.25,4);
/* 開発用。?scenebars=16 でシーンの長さを小節数で固定する。Jev の遷移の判断 (D-8) を
   数分待たずに確かめるのに使う。16の倍数に丸め、遷移に8小節要るので16を下限にする */
const forcedSceneBars=(()=>{
  const n=qsNum('scenebars',16,1024);
  return n===null ? null : Math.round(n/16)*16;
})();
/* 開発用。?sparklow でメロディ全体を必ず1オクターブ下げ、?sparklow=0 で下げない (two:D-79) */
const forcedSparkLow=(()=>{
  const v=QS.get('sparklow');
  return v===null ? null : !(v==='0' || v==='false');
})();
let seqB=null, patSeedB=1;    // ミックス中に重ねる、新シーンぶんの並び
let sceneStartBar=0;     // そのシーンが始まった小節
let sceneBars=0;         // このシーンを何小節続けるか
let recent=[];           // 直近に出たシーン。同じものを続けて引かないため

// 陰陽の波。陰 → 陽 → 陰 を 20〜40 分かけて往復する (two:D-13)
let wavePos=0;           // 0〜1 の位相
let wavePeriod=1800;     // 秒。1周期。揺らぎを持たせて毎回同じ形にはしない
const waveYY = pos => .5 - .5*Math.cos(pos*Math.PI*2);

function newWavePeriod(){ wavePeriod=rand(1200,2400); }

const CROSS_GROUP=.8;   // 別の群へ渡る割合 (two:D-53)

/* 波の位置から次のシーンを選ぶ。直近に出たものは避け、群をまたぐ相手を優先する (two:D-53)。
   回路もキットも入れ替わるので、変化がいちばん鮮やかに出る */
/* avoid に群の名前を渡すと、その群のシーンを候補から外す。
   再生開始時に stab を避けるのに使う (two:D-80)。遷移や next では渡さない */
function chooseScene({avoid=null}={}){
  const yy=waveYY(wavePos);
  const cand=SCENES.map((s,i)=>({i,d:Math.abs(s.yy-yy)}))
    .filter(c=>!recent.includes(c.i) && SCENES[c.i].group!==avoid)
    .sort((a,b)=>a.d-b.d);
  if(!cand.length) return Math.floor(Math.random()*SCENES.length);
  const near=cand.slice(0,5);   // 波から離れすぎない範囲。この中で相手を選ぶ
  const sc=SCENES[sceneIdx];
  const other=near.filter(c=>SCENES[c.i].group!==sc.group);
  if(other.length && Math.random()<CROSS_GROUP) return pick(other).i;
  /* 残りは同じ群へ。ここは連続変形 (two:D-5 方式2) の出番なので、
     その成立条件であるキットまで同じ相手を先に採る */
  const same=near.filter(c=>SCENES[c.i].group===sc.group);
  const twin=same.filter(c=>SCENES[c.i].kit===sc.kit);
  return (twin.length ? pick(twin) : same.length ? pick(same) : pick(cand.slice(0,3))).i;
}

// evolution が高いほどシーンは短い。2〜5分 (two:D-12) を小節数に直す
// mul は Jev が選んだ長さの倍率 (D-8)
function sceneLengthBars(mul=1){
  if(forcedSceneBars) return forcedSceneBars;
  const sec=lerp(300,120,current.evolution)*rand(.85,1.15)*mul;
  // 16小節の倍数に丸める。末尾の8小節は遷移のブレイクに使うので、最低でも32小節取る
  return Math.max(32, Math.round(sec/(60/bpmNow()*4)/16)*16);
}

function enterScene(idx,{manual=false,keepKey=false}={}){
  sceneIdx=idx;
  nextPending=false;   // 乗り換わったので next の点滅を止める (two:D-62)
  if(manual){
    /* 手で選んだら遷移は打ち切る。ミックスの途中なら2本目の経路も戻す。
       戻さないと同じ小節の残りで行き先の無い並び (seqB) を鳴らそうとして、
       キットが引けずに例外になり、進行ごと止まる */
    if(pendingScene>=0 && transitionMode==='mix' && ctx) endMixFades(ctx.currentTime);
    pendingScene=-1; transitionEndBar=-1;
  }
  // 遷移の途中で問い合わせたキーと進行 (D-8)。手で選んだときは使わない
  const ans = manual ? null : jevTake('harm',transitionEndBar);
  if(!keepKey){   // キーはシーンごとに五度圏で近い調へ移る (two:D-9)。平行移動も戻す
    const k=jevChoice(ans,'key');
    if(k!==null) keyPc=NOTE_NAMES.indexOf(k); else moveKey();
    shiftOff=0;
  }
  pedalUntilBar=-1;
  reseedPattern();    // 並びも引き直す。前のシーンの模様を持ち越さない
  // 回路が変わるので和音の進行も選び直す。Jev の進行は、問い合わせたときに引いた lush の側から選ぶ
  const pk=jevChoice(ans,'prog');
  if(pk!==null){
    lushOn=jev.nextLush;
    prog=(lushOn ? LUSH_PROGS : PROGS)[circuit()][+pk.slice(1)];
    progPos=0; setChord();
  }else pickProg();
  // 陽と electro funk では刻む音になりやすく、陰では持続する音になりやすい
  bassTight = Math.random() < .5;   // 持続する音色とタイトな音色を半々で引く (two:D-25)
  rollNoise(SCENES[idx].group);     // インダストリアル・ノイズを出すかどうか (two:D-38)
  // コード弾きを持続音にするか連打にするか (two:D-34)。出やすさはシーンごとに持つ
  padChop = Math.random() < (SCENES[idx].chop||0);
  // リフのモチーフはシーンごとに引き直す (two:D-75)。跨いで残すと合図の役が薄れる
  sparkMotif=null; sparkAnswerAt=-1;
  chordAt=-999;       // 次の小節で必ず和音を組み直す
  sceneStartBar=barCount;
  sceneBars=sceneLengthBars(manual ? 1 : LEN_MUL[jev.nextLen]||1);
  jev.nextLen=null;
  recent.push(idx); if(recent.length>3) recent.shift();
  histPush('scenes',{id:SCENES[idx].id, plannedBars:sceneBars});
  histPush('keys',{key:keyName(keyPc)});
  // 手で選ばれた場合は、そのシーンの陰陽へ波の位置を移してから続きを進める (two:D-13)
  if(manual) wavePos=yyToWavePos(SCENES[idx].yy);
  target.yy=SCENES[idx].yy;
  sceneEdited=false;
  updateScene();
  highlightScene();
  showProgress();   // 調と和音の表示も同時に追随させる。次の小節まで古い値を出さない
}

// 陰陽値から波の位相を逆に引く。いまが上り坂なら上り側、下り坂なら下り側を返す
function yyToWavePos(yy){
  const a=Math.acos(clamp(1-2*yy,-1,1))/(Math.PI*2);   // 0〜.5 (上り)
  const rising = (wavePos%1) < .5;
  return rising ? a : 1-a;
}

/* ---- 第2層 フレーズ (16小節) ---- */
const PHRASE_BARS=16;
const BREAK_BARS=1;        // ブレイクは長くて1小節。それ以上続けると間延びする (two:D-24)
const TRANSITION_BARS=8;   // 遷移に充てる長さ (two:D-5 方式1)。ブレイクになるのは最後の1小節だけ
let phrase='plateau', phraseStartBar=0, phraseLen=PHRASE_BARS;

function choosePhrase(){
  const w=SCENES[sceneIdx].w;
  let sum=0; for(const k of PHRASES) sum+=w[k]||0;
  if(sum<=0) return 'plateau';
  let r=Math.random()*sum;
  for(const k of PHRASES){ r-=(w[k]||0); if(r<=0) return k; }
  return 'plateau';
}

// build が続いたあとは drop で剥がす、といった並びの制約はここに置く (two:D-9)
function nextPhrase(){
  const prev=phrase;
  // Jev の答えは、そのシーンで出うるフレーズ型 (w>0) に限って使う (D-8)
  const w=SCENES[sceneIdx].w;
  let p=jevChoice(jevNow.phrase,'phrase',k=>(w[k]||0)>0) ?? choosePhrase();
  if(prev==='build' && p==='build' && Math.random()<.6) p='drop';
  // 積み上げから戻しへ抜ける頭で、調ごと全音上げる (two:D-65)。和音は同じ度数のまま組み直す
  if(prev==='build' && p==='drop' && Math.random()<current.shift*.8){
    keyPc=(keyPc+2)%12;
    chordRevoice=true;
  }
  if(prev==='break' && p==='break') p='drop';
  phrase=p; phraseStartBar=barCount;
  phraseLen = p==='break' ? BREAK_BARS : PHRASE_BARS;   // ブレイクだけは1小節で抜ける
  reseedPattern();
  // 開いた和声 (two:D-66) を引き直し、変わったら進行ごと選び直す
  if(chordAt>-900 && rollLush(jevP(jevNow.shift,'lush',current.lush,Math.min(1,current.lush/.5)))){
    pickProg({roll:false}); chordAt=-999;
  }
  // ジャズ / ボッサ回路は主役シーンだけでなく、他のシーンへも短く差し込む (two:D-9)
  epGuest = circuit()!=='jazz' && phrase!=='break' && Math.random()<.18;
  histPush('phrases',{phrase:p});
  showProgress();
}

/* ---- 第3層 イベント (4 / 8 小節の節目) ---- */
let lastEvent='—', lastEventBar=-99;

function maybeEvent(bar,time){
  const sc=SCENES[sceneIdx];
  /* Jev の答えがあれば使う (D-8)。none なら何も起こさない。
     glitch スライダーを絞ったときは、グリッチ系を Jev にも選ばせない */
  const glitchOk=current.glitch>=.1;
  const jk=jevChoice(jevNow.phrase,'event',
    k=>k==='none' || EVENTS.some(e=>e.id===k && (glitchOk || !e.glitchy)));
  if(jk!==null){
    if(jk!=='none'){ lastEvent=jk; lastEventBar=bar; fireEvent(jk,bar,time); histPush('events',{event:jk}); }
    showProgress();
    return;
  }
  // ブレイク中と定常では起きやすさが違う。build の途中は仕掛けを増やす
  const base = phrase==='build' ? .55 : phrase==='plateau' ? .30 : .40;
  if(Math.random()>base) return;
  const weights=EVENTS.map(e=>{
    if(!e.glitchy) return e.p;
    return e.p*(0.2+current.glitch*1.6)*(0.4+sc.glitch*1.2);   // グリッチ系だけ二重に重み付ける
  });
  let sum=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*sum;
  for(let i=0;i<EVENTS.length;i++){
    r-=weights[i];
    if(r<=0){
      lastEvent=EVENTS[i].id; lastEventBar=bar; fireEvent(lastEvent,bar,time);
      histPush('events',{event:lastEvent});
      break;
    }
  }
  showProgress();
}

/* ============================================================
   リズム生成 (two:D-7)
   ------------------------------------------------------------
   トラックごとに別の方式で作る。一律に確率を回すと、土台が崩れるか
   ハットがベタになるかのどちらかに落ちるため。
   各トラックは16個の強さ (0 なら鳴らさない) を持つ。
   ============================================================ */
const seq={kick:[],snare:[],clap:[],hat:[],ohat:[],perc1:[],perc2:[],rim:[],bass:[],
           stab:[],ep:[],arp:[],riff:[],fill:[],lead:[],chop:[],hat32:[],spark:[]};
let leadType='sawtooth';   // 16分シーケンスの音色。小節ごとに引き直す
// オカズが次の小節へはみ出したぶん。次の小節の頭に足される
let pendingSpill=null;
// ジャズ回路を他のシーンへ短く差し込んでいる間だけ立つ (two:D-9)
let epGuest=false;
let hatRot=0, percPer=[3,5], percOff=[0,0], kickVariant=null;

/* 並びは毎小節引き直すが、種が同じなら同じ並びが出る。
   種が変わるのはシーン・フレーズが切り替わったときと、変異が当たったときだけ。
   こうしないとミニマルに要る反復が出ず、小節ごとにばらばらの並びになってしまう */
let patSeed=1234;
function rng(seed){
  let a=seed>>>0;
  return ()=>{
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  };
}
function reseedPattern(){ patSeed=(Math.random()*1e9)|0; }

// ユークリッドリズム E(k,n)。k個を n個の枠へ均した位置に置く。
// Bjorklund の厳密な手続きではないが、等間隔に散る点は同じで、定型から外れた並びが得られる
function euclid(k,n){
  const out=new Array(n).fill(false);
  if(k<=0) return out;
  for(let i=0;i<k;i++) out[Math.floor(i*n/k)%n]=true;
  return out;
}

// electro funk 局面のキック。4つ打ちを離れてシンコペーションへ寄る (two:D-3 の B 要素)
const FUNK_KICK=[
  [0,3,6,10],
  [0,6,10,12],
  [0,4,7,10,14],
  [0,3,8,11],
];
// キックの変形演算子。節目でだけ呼ばれる (two:D-7)
const KICK_OPS=['skip','push','double','ghost'];

function applyKickOp(k,op){
  switch(op){
    case 'skip':   k[12]=0; break;                       // 4拍目を抜く
    case 'push':   k[12]=0; k[11]=1; break;              // 4拍目を食う
    case 'double': k[10]=Math.max(k[10],.85); break;     // 8分の裏を足す
    case 'ghost':  k[14]=Math.max(k[14],.45); break;     // 小さく差し込む
  }
}

/* ---- ベースの並び (two:D-7) ----
   音の並びより「フィルタがどう動くか」で性格が決まるトラックなので、
   位置と音価をシーンの陰陽から決め、度数は重み表から引く */
const BASS_GRIDS={
  slow:   [0,8],
  mid:    [0,6,8,14],
  eighth: [0,2,4,6,8,10,12,14],
  funk:   [0,3,6,8,11,14],
  busy:   [0,2,3,6,8,10,11,14],
};
/* 度数の重み。いま鳴っている和音の構成音から引く。
   ルート音を鳴らすのが基本で、5度がそれに次ぐ (two:D-17)。
   ときどき音階側の音へ逸れるが、それは例外として扱う */
const CHORD_DEG_W=[6,1.4,3,1.2,1,1];
// 明るい響きの品質。ベースの動き方をここで分ける (two:D-26)
const BRIGHT_QUAL=['maj9','add9','sus2','x13'];
const OFF_CHORD_P=.12;   // 和音から逸れる確率
const BASS_OCT_P=.35;    // 同じ音程が続いたときにオクターブを動かす確率 (two:D-51)

function bassBar(bar,R,kickPat,scIdx,phr){
  const sc=SCENES[scIdx];
  // 陰陽と密度は少しずつ動き続けるので、そのまま判定に使うと小節ごとに旋律が変わる。
  // 0.1 刻みに丸めて、値がひと目盛り動くまでは同じ旋律を保つ (two:D-30)
  const yy=Math.round(current.yy*10)/10, d=Math.round(current.density*10)/10;
  const sl=scale();
  const out=new Array(16).fill(null);
  if(phr==='break') return out;   // ブレイクではベースも抜く

  // 和音のルートに合わせる。基準は C (midi 24) から数える。
  // ここを12の倍数にしておかないと、鳴る音名が調とずれる
  // ペダル中は前の根音 (two:D-65)、分数コードならその低音 (two:D-66)
  const slash = chordBassDeg!=null && !(bar<pedalUntilBar);
  let root=24+(bar<pedalUntilBar ? pedalPc : tonic()+((slash ? chordBassDeg : chordDeg)%12));
  while(root<31) root+=12;   // 低すぎると芯が消えるので、音域は 31〜42 に収める
  while(root>42) root-=12;
  const iv=QUALITIES[chordQual]||QUALITIES.m9;

  const grid = sc.group==='funk' ? (R()<.5?BASS_GRIDS.funk:BASS_GRIDS.busy)
             : yy<.32 ? BASS_GRIDS.slow
             : yy<.55 ? BASS_GRIDS.mid
             : (R()<.5?BASS_GRIDS.eighth:BASS_GRIDS.mid);
  const busy=clamp(.35+yy*.45+d*.2);
  const legato = yy<.4 ? .95 : .6;   // 陰は音価が長く、陽は短く刻む

  const hits=[];
  for(const i of grid){ if(i===0 || R()<busy) hits.push(i); }
  if(!hits.length) hits.push(0);

  // ルート以外の音は1小節にひとつだけ選び、それを使い回す。
  // 打点ごとに引き直すと旋律が動きすぎる (two:D-19)
  const sumW=iv.reduce((a,_,k)=>a+(CHORD_DEG_W[k]||1),0);
  let alt=0;
  {
    let r=R()*sumW;
    for(let k=0;k<iv.length;k++){
      r-=(CHORD_DEG_W[k]||1);
      if(r<=0){ alt=iv[k]%12; break; }   // 9th などは1オクターブ下げて低音域に置く
    }
  }
  // ルートから離れる頻度。陰では動かず、陽と funk で少し動く。
  // さらに、明るい和音では動かさず、暗い和音では動かす (two:D-26)。
  // 明るい響きはルートを踏み続けたほうが伸びるが、暗い響きは動いたほうが陰影が出る
  const bright=BRIGHT_QUAL.includes(chordQual);
  const moveP=clamp((.10+yy*.18+(sc.group==='funk'?.12:0))*(bright?.45:1.5));
  const lastHit=hits[hits.length-1];
  // 持続する太い音色では、同じ音程が続くとオクターブを上下させる。どの群のシーンでも行う (two:D-51)
  const octJump = !bassTight;
  let prevPitch=null;

  for(let n=0;n<hits.length;n++){
    const i=hits[n];
    let deg=0;
    if(i!==0 && !slash && R()<moveP){   // 分数コードでは低音を動かさない
      // 和音から逸れることもあるが、音階の中から選ぶので調からは外れない
      deg = R()<OFF_CHORD_P ? sl[Math.floor(R()*sl.length)] : alt;
    }
    // オクターブ上げは小節の最後の打点だけ。ここも動きの元になるので控える
    let oct = (i===lastHit && i!==0 && yy>.6 && R()<.12) ? 12 : 0;
    const pitch=root+deg;
    if(octJump && !oct && pitch===prevPitch && R()<BASS_OCT_P){
      // 元の音域が低いので8割は上げる。下げるのは低くなりすぎないときだけで、
      // 芯が消えるので midi 28 を下限にする
      oct = (pitch-12>=28 && R()<.2) ? -12 : 12;
    }
    prevPitch=pitch;
    const next = n+1<hits.length ? hits[n+1] : 16;
    const steps=Math.max(1,(next-i)*legato);
    // キックと同じ位置はアクセント。フィルタの叩き方が変わる
    const acc = (kickPat[i]||0)>0 ? .85 : .3;
    out[i]={midi:root+deg+oct, steps, vel:.55+acc*.35, accent:acc};
  }
  return out;
}

/* 小節ぶんの並びを作る。
   どのシーンとして作るかを引数で受けるので、DJ ミックス風の遷移 (two:D-5 方式3) では
   旧シーンと新シーンの2つ分を同じ小節に対して作れる */
function buildBar(bar,scIdx,phr,seed,fillBar){
  const sc=SCENES[scIdx], d=current.density;
  const funk = sc.group==='funk';
  const quiet = phr==='break', dub = phr==='dubout';
  const out={};

  // 2小節でひと組。偶数小節と奇数小節で別の顔を持たせる
  const R=rng(seed+(bar%2)*7919);

  if(R()<.5) hatRot=Math.floor(R()*16);
  percPer=[[3,5,7][Math.floor(R()*3)],[5,7,11][Math.floor(R()*3)]];
  percOff=[Math.floor(R()*16),Math.floor(R()*16)];

  // --- キック: 4つ打ちを基本堅持。節目でだけ崩す
  const k=new Array(16).fill(0);
  if(funk && !quiet){
    for(const i of FUNK_KICK[Math.floor(R()*FUNK_KICK.length)]) k[i]=1;
  }else{
    for(const i of [0,4,8,12]) k[i]=1;
  }
  if(dub){ k[4]=0; k[12]=0; }               // dub 局面は2拍ぶんだけ残す
  // 8小節の終わりでのみ変形する。それ以外の小節は素のまま
  const edge = (bar%8===7);
  kickVariant = edge ? KICK_OPS[Math.floor(Math.random()*KICK_OPS.length)] : null;
  if(kickVariant) applyKickOp(k,kickVariant);
  if(quiet) k.fill(0);
  k[0]=quiet?0:Math.max(k[0],1);            // 小節頭は変異させない (ブレイク中を除く)
  out.kick=k;

  // --- スネア / クラップ: 2・4拍が基本。funk ではゴーストを足す
  const sn=new Array(16).fill(0), cl=new Array(16).fill(0);
  if(!quiet && !dub){
    if(sc.kit==='electro' || funk){ cl[4]=1; cl[12]=1; }
    else { sn[4]=1; sn[12]=1; }
    if(funk){
      if(R()<.6) sn[7]=.35;
      if(R()<.4) sn[14]=.3;
    }
    if(edge && Math.random()<.5) sn[15]=.5;   // 小節をまたぐ手前の合図
  }
  out.snare=sn; out.clap=cl;

  // --- ハット: ユークリッドを主軸に、密度で間引き、拍で強弱を付ける
  const e=euclid(sc.hatK,16);
  const hat=new Array(16).fill(0), oh=new Array(16).fill(0);
  for(let i=0;i<16;i++){
    if(!e[(i+hatRot)%16]) continue;
    if(R()>0.45+d*.55) continue;               // 密度が低いと抜ける
    hat[i]=(i%4===0?.9:i%2===0?.7:.55)*(.85+R()*.27);
  }
  if(!quiet && R()<.55){
    // オープンハットは裏拍にひとつだけ。定型を避けるため位置は種ごとに引き直す
    const cand=[2,6,10,14].filter(i=>hat[i]>0 || R()<.4);
    if(cand.length){ const i=cand[Math.floor(R()*cand.length)]; oh[i]=.8; hat[i]=0; }
  }
  // ときどき32分で刻み直す (two:D-47)。定型のハットから外す仕掛けのひとつ
  const h32=new Array(16).fill(0);
  if(!quiet){
    for(let i=0;i<16;i++){
      if(!hat[i]) continue;
      if(R()<.13+(phr==='build'?.07:0)) h32[i]=hat[i]*(.55+R()*.3);
    }
  }
  out.hat=hat; out.ohat=oh; out.hat32=h32;

  // --- パーカッション: 互いに素な周期を回してポリリズムを作る (two:D-7)。
  // 小節をまたいで模様が変わっていくよう、位置は通し番号で決める
  const p1=new Array(16).fill(0), p2=new Array(16).fill(0);
  for(let i=0;i<16;i++){
    const g=bar*16+i;
    if(g%percPer[0]===percOff[0]%percPer[0] && R()<.35+d*.5) p1[i]=.5+R()*.4;
    if(g%percPer[1]===percOff[1]%percPer[1] && R()<.25+d*.45) p2[i]=.4+R()*.4;
  }
  out.perc1=p1; out.perc2=p2;

  // --- リム: 陰のキットだけ、まばらに
  const rm=new Array(16).fill(0);
  if(sc.kit==='deep' || dub){
    for(let i=0;i<16;i++) if(R()<.06+d*.10) rm[i]=.4+R()*.4;
  }
  out.rim=rm;

  /* --- ベース ---
     小節ごとに引き直さない。種が変わるまでは同じ旋律が続くので、
     少なくとも2小節、実際にはフレーズのあいだ同じ形が繰り返される (two:D-30)。
     オカズの小節だけは例外で、そこは動いてよい */
  const Rb=rng(seed+4242+(fillBar?bar*97:0));
  out.bass=bassBar(bar,Rb,k,scIdx,phr);

  // --- ハーモニー。鳴らす回路はシーンが決める (two:D-8)
  const cir=sc.group;
  const stab=new Array(16).fill(0), ep=new Array(16).fill(0),
        arp=new Array(16).fill(0), riff=new Array(16).fill(0);
  if(cir==='stab' && !quiet){
    // 裏拍に短く刺す。位置は種ごとに引き直す
    for(const i of [2,6,10,14]) if(R()<.62) stab[i]=.7+R()*.3;
    if(R()<.3) stab[7]=.5;
  }
  if((cir==='jazz'||epGuest) && !quiet){
    const pr = cir==='jazz' ? .45 : .22;
    for(const i of [0,3,6,10,11,14]) if(R()<pr) ep[i]=.6+R()*.4;
  }
  // 持続回路の上2層。実際に出るかは padLayers() が決める
  for(let i=0;i<16;i++){
    if(i%2===0 && R()<.85) arp[i]=.5+R()*.3;
    if((i===0||i===3||i===6||i===11) && R()<.55) riff[i]=.5+R()*.4;
  }
  /* 連打の並び (two:D-34)。8分を基本に、たまに16分の返しを足す。
     持続音の代わりなので、層の数が増えるほど詰まる */
  const chop=new Array(16).fill(0);
  if(padChop && !quiet && (cir==='sustain'||cir==='funk')){
    const dens=clamp(.45+d*.35+(phr==='build'?.2:0));
    for(let i=0;i<16;i+=2){
      if(R()>dens) continue;
      chop[i]=(i%4===0?.95:.7)*(.85+R()*.3);
      if(R()<.28) chop[i+1]=.5;   // 16分の返し
    }
  }
  out.chop=chop;

  out.stab=stab; out.ep=ep; out.arp=arp; out.riff=riff;

  /* --- 16分のシーケンス (two:D-21) ---
     ベースと同じく動きすぎないよう、1小節で使う音は2〜3個に絞り、
     和音の構成音から引く */
  const lead=new Array(16).fill(null);
  if(!quiet){
    const iv2=QUALITIES[chordQual]||QUALITIES.m9;
    let lroot=48+tonic()+(chordDeg%12);
    while(lroot<60) lroot+=12;
    while(lroot>71) lroot-=12;
    const palette=[0];
    palette.push(iv2[Math.min(2,iv2.length-1)]%12);              // 5度あたり
    if(R()<.6) palette.push(iv2[Math.min(1,iv2.length-1)]%12);   // 3度あたり
    const gate=clamp(.30+d*.45+(phr==='build'?.15:0));
    let last=0;
    for(let i=0;i<16;i++){
      if(R()>gate) continue;
      // 同じ音を続けるほうが多くなるようにする
      if(R()<.35) last=palette[Math.floor(R()*palette.length)];
      const oc = R()<.12 ? 12 : 0;
      lead[i]={midi:lroot+last+oc, vel:(i%4===0?.95:i%2===0?.8:.62)*(.85+R()*.3)};
    }
  }
  out.lead=lead;
  return out;
}

/* ---- オカズ (two:D-20) ----
   並びが切り替わる直前の小節に置く。8小節ごとの折り返しと、
   遷移の直前がその対象になる。たまに次の小節へはみ出す */
function isFillBar(bar){
  // 乗り換え前の小節はブレイクでもオカズを入れる。ダブを引いたらダブが出口のオカズを持つ (two:D-62)
  if(pendingScene>=0 && bar===transitionEndBar-1) return !preChangeDub;
  if(phrase==='break') return false;
  return (bar-phraseStartBar+1)%8===0;
}

function makeFill(bar){
  const R=rng(patSeed+bar*131);
  const len=3+Math.floor(R()*8);             // 小節の終わりから3〜10ステップ
  const start=16-len;
  // 指定があってもここは引いておく。種の消費順が変わると並びごと変わってしまう
  const drawn=R()<.55?'tom':'snare';
  const kind=forcedFill||drawn;
  const rest=.12+R()*.34;                    // この回の休符の出やすさ
  let tone=.45+R()*.35;                      // 始まりの音程
  const fill=seq.fill;
  for(let n=0;n<len;n++){
    const i=start+n;
    if(R()<rest) continue;                   // 休符。毎回違う場所が空く
    const u=n/(len-1||1);
    const vel=clamp(.35+u*.5+(R()-.5)*.3,.15,1);
    // 音程は下り基調。ただし2割ほどは跳ね上がって、直線に並ばないようにする
    tone = R()<.22 ? clamp(tone+rand(.2,.6),-.9,.9)
                   : clamp(tone-rand(.05,.3),-.9,.9);
    fill[i] = kind==='tom' ? {v:'tom', vel, tone} : {v:'sd', vel};
    // ときどき32分で詰める
    if(R()<.22) fill[i].sub={vel:vel*.8, tone:clamp(tone-rand(0,.25),-.9,.9)};
    if(kind==='snare'){ seq.hat[i]=0; seq.ohat[i]=0; }   // 場所を譲る
  }
  // はみ出し。次の小節の頭にひと打ちかふた打ち残す
  pendingSpill = R()<.35
    ? Array.from({length:1+Math.floor(R()*2)},(_,n)=>({
        i:n, v:kind==='tom'?'tom':'sd', vel:.9-n*.2, tone:-.45-n*.2 }))
    : null;
  // 折り返しの頭にはシンバルを置く
  if(R()<.6) pendingSpill=(pendingSpill||[]).concat([{i:0,v:'cy',vel:.7}]);
}

// いま鳴っているシーンぶんを引き直す。onBar() の頭で呼ぶ
// ディレイの出力の素の値。apply() と dub (two:D-49) の両方が使う
const dlyOutL = () => .18+current.space*.5;
const dlyOutR = () => .16+current.space*.45;

/* ---- ダブ (two:D-49) ----
   1小節だけ、ドラムを落として全体をディレイに放り込み、
   小節の終わりのオカズで戻す。electro funk のシーンで32小節ごとに30%、
   他のシーンでは極めてまれ。 */
let dubAt=-1, dubBar=-1, dubStart=0;
/* 乗り換え前の小節 (two:D-62)。シーンが変わる直前の小節は、この確率でダブ、それ以外はオカズで合図する。
   ?dub / ?dub=0 の指定があればその値を使う。preChangeDub はいまの小節で引いた結果、
   curFillBar はいまの小節にオカズを置いたか (表示用) */
const PRECHANGE_DUB_P=.4;
let preChangeDub=false, curFillBar=false;

function planDub(bar){
  // 指定があるときは周期も4小節まで詰めて、シーンの種類も問わない
  const every = forcedDub===null ? 8 : 4;
  if(bar%every!==0 || phrase==='break' || pendingScene>=0) return;
  const p = forcedDub!==null ? forcedDub
          : jevP(jevNow.phrase,'dub',SCENES[sceneIdx].group==='funk' ? .50 : .20);   // D-8
  if(Math.random()>=p) return;
  // 判定した範囲から4小節区間をひとつ引き、その4小節めか2小節めに置く
  const blk=Math.floor(Math.random()*(every/4));
  dubAt = bar + blk*4 + (Math.random()<.6 ? 3 : 1);
}

/* 出口のオカズ。最後の16分4個に置く。
   makeFill() より振りを大きくし、32分も多めに混ぜる (Issue #3) */
function makeDubFill(bar){
  const R=rng(patSeed+bar*577+13);
  const kind=R()<.5?'tom':'sd';
  let tone=.3+R()*.5;
  for(let i=12;i<16;i++){
    if(R()<.18) continue;                      // ここだけは間引きを浅くする。戻しの合図なので
    tone = R()<.4 ? clamp(tone+rand(-.7,.7),-.9,.9) : clamp(tone-rand(.05,.4),-.9,.9);
    const vel=clamp(.45+(i-12)/3*.45+(R()-.5)*.4,.2,1);
    seq.fill[i] = kind==='tom' ? {v:'tom', vel, tone} : {v:'sd', vel};
    if(R()<.5) seq.fill[i].sub={vel:vel*.85, tone:clamp(tone+rand(-.5,.5),-.9,.9)};
  }
}

/* 音の側の仕掛け。time が要るので onBar() から呼ぶ */
function fireDub(time){
  const sw=stepDur(), barSec=sw*16;
  const t0=time+dubStart*sw;     // ここから落ちる
  const t1=time+barSec;          // 小節の終わりで戻す

  /* ディレイは左右とも8分か付点8分に揃える。
     ここが dub の要なので、フィードバックをほぼ 1 まで上げて返しを減らさず、
     出力も上げていって、鳴っているあいだ次第に大きくなるようにする。
     そのままでは収まらないので、**小節末か次の小節の1拍終わりで切って落とす** */
  const dt=(Math.random()<.5 ? 2 : 3)*sw;
  const cut = Math.random()<.75 ? t1 : t1+sw*4;  // 小節末 (3/4) / 次の小節の1拍終わり (1/4)
  const back = cut+dt*1.2;                       // 溜まったぶんを吐かせてから戻す
  for(const [tap,base] of [[delayNodes.tapL,dlyOutL],[delayNodes.tapR,dlyOutR]]){
    tap.d.delayTime.cancelScheduledValues(t0);
    tap.d.delayTime.setTargetAtTime(dt,t0,.04);
    // フィードバック: 返しがほとんど減らない深さまで上げる
    tap.fb.gain.cancelScheduledValues(t0);
    tap.fb.gain.setValueAtTime(.82,t0);
    tap.fb.gain.linearRampToValueAtTime(1.08,cut);
    tap.fb.gain.setValueAtTime(0,cut);           // 切る。ここで回りが止まる
    // 出力: 素の2倍から入り、切る手前まで上がり続ける
    tap.o.gain.cancelScheduledValues(t0);
    tap.o.gain.setTargetAtTime(base()*2,t0,.02);
    tap.o.gain.setValueAtTime(base()*2,t0+.06);
    tap.o.gain.linearRampToValueAtTime(base()*3.2,cut);
    tap.o.gain.setValueAtTime(0,cut);            // 余韻を残さず落とす
    tap.o.gain.setValueAtTime(0,back);
    tap.o.gain.linearRampToValueAtTime(base(),back+.05);
  }
  // 送りを上げて全トラックをディレイに乗せる
  dlySend.gain.cancelScheduledValues(t0);
  dlySend.gain.setTargetAtTime(2.2,t0,.02);
  dlySend.gain.setTargetAtTime(1,t1,.05);
  // 原音だけを閉じる。返しはこのフィルタを通らないので生き残る
  const f=dubFilter.frequency;
  f.cancelScheduledValues(t0);
  f.setTargetAtTime(600,t0,.02);
  f.setTargetAtTime(20000,t1,.06);

  evDelayUntil=back+.06;   // apply() との取り合いを避ける
}

/* ---- キラキラのリフの出現 (two:D-48) ----
   4小節区間の頭で、その区間に出すかどうかと、出す小節を決める。
   常時鳴らさないことが肝なので、確率と間隔の下限で薄く保つ */
let sparkAt=-1, sparkNotes=null, sparkSpill=null, sparkLastTime=-999;
let sparkOff=null, sparkRhythm=null;    // その回の置き場所の型と、その名前 (two:D-74)
let sparkLabel='', sparkLabelBar=-1;    // どの型で出たかを monitor に出す (two:D-74)

/* ---- リフのモチーフ (two:D-75) ----
   覚えるのは半音ではなく tones の添字の差分。tones はそのときの和音を音域へ
   畳んだ集合なので、差分だけ持って開始位置を引き直せば、同じ形がそのときの
   和音の上で鳴る。移調と再和声化が別処理なしで付いてくる。
   毎回独立に引いていると変奏する相手がいないので、マンネリの逆 (覚えのある形が
   姿を変えて戻る) が成り立たない */
let sparkMotif=null;        // {steps, rhythm, uses, life}
let sparkMotifUse=0;        // その回が何回目の使い回しか。monitor に出す
let sparkTimbre=null;       // その回の音色の組 (two:D-77)。応答はこれをそのまま使う
let sparkLow=false;         // その回はメロディ全体を1オクターブ下げるか (two:D-79)。応答も同じ
let sparkAnswerAt=-1;       // 呼びかけに応答を返す小節 (two:D-75)
const SPARK_REUSE=.5;       // 覚えた形を使い直す確率
const SPARK_ANSWER=.35;     // 呼びかけに応答を返す確率

const SPARK_GAP=22;   // 秒。これより短い間隔では続けて出さない

/* ---- リフのリズムの型 (two:D-74) ----
   off は小節頭から数えた16分の位置。負なら前の小節の終わり (食い)、
   16以上なら次の小節へはみ出す。音は3〜5個なので先頭から使うぶんだけ取る。
   置き場所をこの1本の列に寄せたので、食い・素・後ろ乗り・はみ出しが同じ規則になる */
const SPARK_RHYTHMS={
  quarter:[0,4,8,12,16],    // 素の4分。5音めは次の小節の頭 (two:D-48 の唯一の形)
  push:   [-1,3,7,11,16],   // 食い。前の小節の15から入る
  eighth: [0,2,4,8,16],     // 8分の寄せ。頭に固まって後ろが空く
  three:  [0,3,6,9,12],     // 16分3つ歩き。小節の中で完結する
  laid:   [4,8,12,16,20],   // 後ろ乗り。小節頭を空け、次の小節へ渡る
  syncope:[0,4,7,12,18],    // シンコペ。3拍目の裏を食う
};

/* ---- リフの畳み先 (two:D-76) ----
   上だけ振る。下げると「キラキラ」の性格が薄れ、two:D-52 のオクターブ下げが
   ベースやスタブの域まで降りてしまう。幅は20半音のまま保つ */
const SPARK_FOLDS={mid:[70,89], high:[75,94]};
const SPARK_LOW=.3;   // メロディ全体を1オクターブ下げる割合 (two:D-79)。畳み先の下限とは別に、回ごとに引く

/* ---- リフの音色の組 (two:D-77) ----
   回ごとに1組引き、フレーズ内でも動かす。1音ごとのミクロな揺らぎは耳に届かなかった
   (two:D-74) ので、輪郭の単位で振る。応答 (two:D-75) は呼びかけと同じ組を使う */
const SPARK_DEC={short:.55, mid:1, long:1.8};
const SPARK_DEC_W={short:2, mid:4, long:2};
const SPARK_RING=.15;   // Q 18 (発振寸前) にする割合。高さは two:D-29 の掃引と同じ
/* Web Audio の lowpass の Q は dB。Q が 4 を超えたぶんだけ VCA を下げて、
   発振寸前の回が突出しないようにする。補正なしでは Q 18 の出力ピークが Q 4 の 1.92倍だった。
   0.3 と 0.4 を Q4/Q18 交互の3往復で比べ、peak・rms の比がともに 0.9 前後に収まる 0.3 にした。
   ベルはフィルタを通らないので補正しない (two:D-77) */
const RES_COMP=qsNum('sparkrescomp',0,1) ?? .3;   // 開発用に ?sparkrescomp= で差し替えて比べられる
// フレーズ内の動き。u は音の位置 0〜1、last は最後の音かどうか
const SPARK_CUT_SHAPE={
  flat: u=>1,
  open: u=>.6+u,              // 0.6 → 1.6。開いていく
  close:u=>1.6-u,             // 1.6 → 0.6。閉じていく
  arch: u=>.7+3.6*u*(1-u),    // 両端 0.7、真ん中 1.6。上って下る
};
const SPARK_DEC_SHAPE={
  flat: (u,last)=>1,
  grow: (u,last)=>.7+.8*u,    // 0.7 → 1.5。伸びていく
  tail: (u,last)=>last?1.9:.85,   // 最後の音だけ長く残す
};
const SPARK_Q_SHAPE={
  flat: u=>1,
  rise: u=>.6+.8*u,           // 0.6 → 1.4。終わりへ向けて緊張させる
};

function drawSparkTimbre(){
  const decK=wpick(SPARK_DEC_W);
  let cut=Math.exp(rand(Math.log(.5),Math.log(2)));   // 暗い〜明るいを対数で一様に
  // 短くて暗い回は合図として聴こえにくい。短いときは並より暗くしない
  if(decK==='short') cut=Math.max(cut,1);
  const ring = Math.random()<SPARK_RING;
  const q = forcedSparkQ ?? (ring ? 18 : rand(2,12));
  return {
    dec:SPARK_DEC[decK], decShape:pick(Object.keys(SPARK_DEC_SHAPE)),
    // 開発用に固定したときは動きも付けない。対にした計測を濁らせないため
    cut:forcedSparkCut ?? cut,
    cutShape: forcedSparkCut!=null ? 'flat' : pick(Object.keys(SPARK_CUT_SHAPE)),
    env:rand(1.5,8),
    // 発振寸前はそれだけで十分に際立つので、フレーズ内では動かさない
    q, qShape: (q>=18 || forcedSparkQ!=null) ? 'flat' : pick(Object.keys(SPARK_Q_SHAPE)),
    ring: q>=18,
  };
}

/* ---- 群ごとのリフの性格 (two:D-76) ----
   n は音数の幅、fold は畳み先の重み、rhythm は型の重み、
   bell はベルの量の倍率、dec は音価の倍率。
   SCENES の行には置かない。性格は群ごと (4行) なのに SCENES は14行あり、
   同じ値を3〜4回書くことになる。SCALES / MODE_LABEL / CIRCUIT_LABEL が既に
   群をキーにした別表で、SCENES の行はシーン固有の値だけを持つ分担になっている */
const SPARK_PROFILE={
  stab:   {n:[3,4], fold:{mid:3,high:1}, bell:1.35, dec:1.15,
           rhythm:{quarter:4,eighth:1,three:0,laid:2,push:0,syncope:1}},
  jazz:   {n:[3,5], fold:{mid:3,high:2}, bell:1.00, dec:1.00,
           rhythm:{quarter:2,eighth:2,three:1,laid:1,push:1,syncope:3}},
  funk:   {n:[3,5], fold:{mid:2,high:3}, bell:0.70, dec:0.75,
           rhythm:{quarter:1,eighth:2,three:3,laid:1,push:4,syncope:2}},
  sustain:{n:[4,5], fold:{mid:3,high:2}, bell:1.00, dec:1.00,
           rhythm:{quarter:3,eighth:3,three:1,laid:1,push:1,syncope:1}},
};
const sparkProfile = () => SPARK_PROFILE[circuit()] || SPARK_PROFILE.jazz;

/* 重みから引く。choosePhrase() が SCENES の w を読むのと同じ
   「合計を取って乱数を引く」形。候補を絞れるようキーの一覧も渡せる */
function wpick(w,keys){
  const ks=keys||Object.keys(w);
  let sum=0; for(const k of ks) sum+=w[k]||0;
  if(sum<=0) return ks[0];
  let r=Math.random()*sum;
  for(const k of ks){ r-=(w[k]||0); if(r<=0) return k; }
  return ks[ks.length-1];
}

/* 置き場所の型を引く (two:D-74)。重みはまだ平ら (群ごとの性格は two:D-76 で入れる)。
   食い (push) は sparkAt-1 の小節で置くので、その小節がもう過ぎている
   sparkAt=bar+1 の枝では引かない。planSpark は placeSpark の末尾で呼ばれ、
   その小節の置き場所の判定はもう終わっているため */
function drawSparkRhythm(bar){
  if(forcedSparkRhythm) return forcedSparkRhythm;
  const names=Object.keys(SPARK_RHYTHMS).filter(k=>!(k==='push' && sparkAt===bar+1));
  return wpick(sparkProfile().rhythm,names);   // 型の重みは群ごと (two:D-76)
}

// 和音を畳み先の音域へ収めた音の集合。リフはこの中だけを歩く (音域は two:D-76 で振る)
function sparkTones(fold){
  const [lo,hi]=SPARK_FOLDS[fold]||SPARK_FOLDS.mid;
  return [...new Set(coreNotes(72).map(n=>{
    while(n<lo) n+=12;
    while(n>hi) n-=12;
    return n;
  }))].sort((a,b)=>a-b);
}

/* 旋律の並びを引く (two:D-48)。順次進行を主に、2割ほど跳ぶ。
   leap[i] は i 番めから次の音への動きが跳躍かどうか */
function drawSparkLine(tones,n){
  let idx=Math.floor(Math.random()*tones.length);
  const line=[], leap=[];
  for(let i=0;i<n;i++){
    line.push(idx);
    const dist=Math.random()<.2 ? 2+Math.floor(Math.random()*2) : 1;
    let next=idx+(Math.random()<.5?-dist:dist);
    if(next<0 || next>tones.length-1) next=idx-(next<0?-dist:dist);   // 端で折り返す
    idx=clamp(next,0,tones.length-1);
    leap.push(dist>=2);
  }
  return {line,leap};
}

/* 覚えた差分から並びを組む (two:D-75)。開始位置は引き直すので、
   同じ形がそのときの和音の別の高さで鳴る */
function motifLine(tones,steps){
  let idx=Math.floor(Math.random()*tones.length);
  const line=[idx], leap=[];
  for(const d of steps){
    let next=idx+d;
    if(next<0 || next>tones.length-1) next=idx-d;   // 端で折り返す
    idx=clamp(next,0,tones.length-1);
    line.push(idx);
    leap.push(Math.abs(d)>=2);
  }
  return {line,leap};
}

/* アクセントに1オクターブ下を使う (two:D-52)。頭と、跳んで着いた音だけ。
   続けては落とさない。旋律ごと下がって、ただの移調に化けるため */
function sparkVoice(tones,line,leap,whole){
  const out=[]; let low=false;
  for(let i=0;i<line.length;i++){
    /* 全体を1オクターブ下げた回 (two:D-79) はアクセントを付けない。さらに下へ降りると
       ベースの上端と濁る。下げた回の音域は、アクセント音がもともと出ていた範囲に収まる */
    low = !whole && !low && (i===0 ? Math.random()<.5 : leap[i-1] && Math.random()<.4);
    const down = low || whole;
    const vel=(i===0?.95:.72+Math.random()*.16);
    // 下げるとフィルタが低い側で開くぶん暗くなるので、少しだけ強く弾く
    out.push({midi:tones[line[i]]-(down?12:0), vel:down?Math.min(vel*1.15,1):vel});
  }
  return out;
}

/* 変奏 (two:D-75)。steps か rhythm の片方だけを触る。
   両方替えると元の形との繋がりが切れて、変奏に聞こえない。
   音の数は3〜5に保つので、伸ばす・削るは端で打ち止めにする */
function varyMotif(m,bar){
  const len=m.steps.length;
  const kinds=['repeat','invert','rerhythm'];
  if(len<4) kinds.push('grow');
  if(len>2) kinds.push('shrink');
  switch(pick(kinds)){
    case 'invert':   return {steps:m.steps.map(d=>-d),               rhythm:m.rhythm};
    case 'grow':     return {steps:m.steps.concat(pick([-2,-1,1,2])),rhythm:m.rhythm};
    case 'shrink':   return {steps:m.steps.slice(0,len-1),           rhythm:m.rhythm};
    case 'rerhythm': return {steps:m.steps,                          rhythm:drawSparkRhythm(bar)};
    default:         return {steps:m.steps,                          rhythm:m.rhythm};   // 移調反復
  }
}

function planSpark(bar){
  if(bar%4!==0) return;
  /* 呼びかけと応答 (two:D-75)。呼びかけの次の区間の2小節めに、変奏で返す。
     同じ身振りの一部なので、確率と間隔の下限 (SPARK_GAP) は通さない */
  const answerNow = sparkAnswerAt===bar+1 && !!sparkMotif && phrase!=='break';
  if(sparkAnswerAt>=0 && sparkAnswerAt<=bar+1) sparkAnswerAt=-1;   // 返したか、取りこぼした
  if(phrase==='break') return;
  if(!answerNow){
    const gap = forcedSpark===null ? SPARK_GAP : 0;
    if(ctx.currentTime-sparkLastTime<gap) return;   // 固まって出るのを防ぐ
    let p=forcedSpark;
    if(p===null){
      /* 毎分1.5回になる確率を BPM から逆算する。4小節区間は 960/bpm 秒。
         間隔の下限が直後の何区間かを塞ぐので、そのぶんを込みで上げておかないと
         実際の回数が目標を割る。応答のぶんだけ回数が増えるので、
         素の側をそのぶん下げて合図の数を据え置く (two:D-75) */
      const per=960/bpmNow();              // 1区間の秒数
      const r=(1.5/(1+SPARK_ANSWER))*per/60;
      const g=Math.floor(SPARK_GAP/per);   // 発火のあと塞がれる区間の数
      p=clamp(r/Math.max(1-r*g,.25),.08,.5);
    }
    if(Math.random()>=p) return;
  }
  /* 食いを固定したときは、食いを置く小節 (sparkAt-1) が残る枝に寄せる。
     sparkAt=bar+1 だとその小節はもう過ぎていて、食いが出ないため (two:D-74) */
  const laterOnly = forcedSparkRhythm==='push';
  /* 新しい旋律を Jev に選ばせる回 (D-8)。応答を待つ間が要るので、必ず3小節先に置く。
     使い回しと応答は覚えた形から作るので、選ばせない */
  const alive0 = sparkMotif && (forcedSparkMotif===true || sparkMotif.uses<sparkMotif.life);
  const viaJev = !answerNow && forcedSparkMotif!==true && jevActive() && Math.random()<jevInfl();
  sparkAt = answerNow ? bar+1 : bar + ((laterOnly || viaJev || Math.random()<.62) ? 3 : 1);
  const prof=sparkProfile();
  // 畳み先は回ごとに引く (two:D-76)。応答も引き直すので、同じ形が別の高さで返ることがある
  const fold = forcedSparkFold || wpick(prof.fold);
  const tones=sparkTones(fold);
  // 3割でメロディ全体を1オクターブ下げる (two:D-79)。応答は呼びかけと同じ高さで返す
  if(!answerNow) sparkLow = forcedSparkLow ?? (Math.random()<SPARK_LOW);

  /* 覚えた形を使い回すか、新しく引くか (two:D-75)。
     応答は必ず変奏なので、覚えた形の側に入る */
  const alive = alive0;
  const reuse = answerNow ||
    (alive && (forcedSparkMotif===true ||
               (forcedSparkMotif!==false && Math.random()<SPARK_REUSE)));
  let cands=null;   // Jev に見せる旋律の候補。同じ音数で6通り
  if(reuse){
    const v = answerNow ? varyMotif(sparkMotif,bar)
                        : {steps:sparkMotif.steps, rhythm:sparkMotif.rhythm};
    sparkRhythm = v.rhythm;
    sparkMotif = {...sparkMotif, steps:v.steps, rhythm:v.rhythm, uses:sparkMotif.uses+1};
    const {line,leap}=motifLine(tones,v.steps);
    sparkNotes=sparkVoice(tones,line,leap,sparkLow);
  }else{
    // リズムだけ前の形から引き継ぐことがある。旋律を替えても身振りは残る
    sparkRhythm = (sparkMotif && Math.random()<.3) ? sparkMotif.rhythm : drawSparkRhythm(bar);
    const [nLo,nHi]=prof.n;                          // 音数の幅は群ごと (two:D-76)
    const n=nLo+Math.floor(Math.random()*(nHi-nLo+1));
    const draw=()=>{
      const {line,leap}=drawSparkLine(tones,n);
      const steps=[];
      for(let i=1;i<line.length;i++) steps.push(line[i]-line[i-1]);
      return {notes:sparkVoice(tones,line,leap,sparkLow), steps};
    };
    const c0=draw();
    if(viaJev) cands=[c0, ...Array.from({length:5},draw)];
    sparkNotes=c0.notes;
    sparkMotif={steps:c0.steps, rhythm:sparkRhythm, uses:1, life:2+Math.floor(Math.random()*3)};
  }
  if(forcedSparkRhythm) sparkRhythm=forcedSparkRhythm;
  // 応答は sparkAt=bar+1 なので、食いを置く小節がもう過ぎている (two:D-74)
  if(answerNow && sparkRhythm==='push') sparkRhythm='quarter';
  sparkOff = SPARK_RHYTHMS[sparkRhythm];
  /* 音色の組 (two:D-77)。応答は呼びかけと同じ組をそのまま使い、形の変奏を聴き取りやすくする。
     素の使い回し (応答でない m2 以降) は引き直す。同じ形が別の音色で戻るのは欲しい変化 */
  if(!answerNow || !sparkTimbre) sparkTimbre=drawSparkTimbre();
  shapeSparkNotes(prof);
  sparkMotifUse = sparkMotif.uses;
  if(cands) jevAskRiff(cands,prof,tones);
  /* 呼びかけには応答を仕込む。応答からは繋げない (際限なく続くため) */
  const canAnswer = !answerNow &&
    (forcedSparkMotif===true || Math.random()<SPARK_ANSWER);
  sparkAnswerAt = canAnswer ? bar+5 : -1;
}

// 音価とベルの量は群の性格 (two:D-76)、明るさ・開き方・Q は音色の組とフレーズ内の動きから。
// ノートに載せて sparkNote へ渡す
function shapeSparkNotes(prof){
  const tb=sparkTimbre, last=sparkNotes.length-1;
  sparkNotes.forEach((nt,i)=>{
    const u = last>0 ? i/last : 0;
    nt.dec  = prof.dec*tb.dec*SPARK_DEC_SHAPE[tb.decShape](u,i===last);
    nt.bell = prof.bell;
    nt.cut  = tb.cut*SPARK_CUT_SHAPE[tb.cutShape](u);
    nt.env  = tb.env;
    nt.q    = clamp(tb.q*SPARK_Q_SHAPE[tb.qShape](u), .5, 18);
  });
}

/* 新しい旋律の候補から Jev に選ばせる (D-8)。いまは候補の1つめを仕込んであり、
   食いを置く小節 (sparkAt-1) の onBar() より前に届いたら差し替える。選ぶ段で乱数を混ぜ直さない
   (Jev に任せるかどうかは planSpark で引いた) */
const midiName=m=>NOTE_NAMES[m%12]+(Math.floor(m/12)-1);
function jevAskRiff(cands,prof,tones){
  const at=sparkAt, riff={};
  cands.forEach((c,i)=>{
    riff['r'+i]=`${c.notes.map(n=>midiName(n.midi)).join(' ')} (${sparkRhythm} rhythm)`;
  });
  jevAsk('riff','riff',{tag:at, deadline:at-1, ask:{riff},
    extra:{chordTones:tones.map(midiName), rememberedMotif:sparkMotif.steps},
    onAnswer:ans=>{
      if(sparkAt!==at || barCount>=at-1) return;   // もう置いたか、取りやめた
      const k=jevChoice(ans,'riff',()=>true,{always:true});
      delete jev.book.riff;
      if(k===null) return;
      const c=cands[+k.slice(1)];
      sparkNotes=c.notes.map(n=>({...n}));
      sparkMotif={...sparkMotif, steps:c.steps};
      shapeSparkNotes(prof);
    }});
}

/* ---- ベースの性格を測る ----
   two:D-39 (疎ならフェーザー) / two:D-42 (動かないならフィルタを振る) / two:D-50 (揺らぎ) の
   判断材料をここでまとめて出す */
function measureBass(){
  bassNotes = seq.bass.filter(Boolean).length;
  // 音名で数える。オクターブを上下させただけの小節 (two:D-51) は「動かない」側に入れる
  const bassPitches = new Set(seq.bass.filter(Boolean).map(b=>b.midi%12)).size;
  // 音程がほとんど動かない小節は、1音ごとにフィルタを揺らして単調さを補う (two:D-42)
  bassWobble = bassPitches<=2;
  /* サスティンのある音色で、旋律が単純な小節にだけ揺らぎを掛ける (two:D-50)。
     タイトな音色は伸びないので掛ける先がない。
     このベースは設計上ほとんどの小節が単純 (音程1つが74%、2つ以下で97%) なので、
     ここは「動きすぎる小節を外す」だけの条件。薄さは9%のほうが担う */
  bassMod = !bassTight && bassPitches>0 && bassPitches<=2 && Math.random()<.09;
}

/* ---- オカズ (two:D-20) を置く ---- */
function placeFill(bar,fillBar){
  seq.fill=new Array(16).fill(null);
  // 前の小節からはみ出したぶんを先に置く
  if(pendingSpill){
    for(const sp of pendingSpill) seq.fill[sp.i]={v:sp.v, vel:sp.vel, tone:sp.tone};
    pendingSpill=null;
  }
  if(fillBar) makeFill(bar);
}

/* ---- キラキラのリフ (two:D-48) を置く ----
   置き場所は型 (two:D-74) の16分オフセット。負なら前の小節の終わりへ食い込み、
   16以上なら次の小節へはみ出す。前の小節へは後から書き戻せないので
   (onBar はその小節のステップ0を予約する直前に走る)、食いは sparkAt-1 の小節で置く */
function placeSpark(bar){
  seq.spark=new Array(16).fill(null);
  // 前の小節からはみ出したぶんを先に置く。任意のステップに来る (two:D-74)
  if(sparkSpill){
    // ブレイクに落ちたら捨てる。無音に1音だけ刺さるのを防ぐ
    if(phrase!=='break') for(const sp of sparkSpill) seq.spark[sp.i]=sp.nt;
    sparkSpill=null;
  }
  const on = sparkNotes && sparkOff && phrase!=='break';
  // 食い。次の小節に出るリフの頭だけを、この小節の終わりへ置く
  if(on && bar===sparkAt-1)
    sparkNotes.forEach((nt,i)=>{ const o=sparkOff[i]; if(o<0) seq.spark[16+o]=nt; });
  if(on && bar===sparkAt){
    const spill=[];
    sparkNotes.forEach((nt,i)=>{
      const o=sparkOff[i];
      if(o<0) return;                                  // 食いで前の小節に置いた
      if(o<16) seq.spark[o]=nt; else spill.push({i:o-16, nt});
    });
    sparkSpill = spill.length ? spill : null;
    sparkLastTime=ctx.currentTime;
    histPush('riffs',{notes:sparkNotes.map(n=>midiName(n.midi)).join(' '), rhythm:sparkRhythm});
    jevLog('riff played',hist.riffs[hist.riffs.length-1].notes);
    // monitor 用 (two:D-74 / two:D-75)。m2 以降は覚えた形の使い回し
    // 音色は輪郭が平らでなければその名前、発振寸前なら ring を足す (two:D-77)
    const tb=sparkTimbre;
    sparkLabel=sparkRhythm+(sparkMotifUse>1?'·m'+sparkMotifUse:'')
      +(tb&&tb.cutShape!=='flat'?' '+tb.cutShape:'')+(tb&&tb.ring?' ring':'')
      +(sparkLow?' low':'');   // メロディ全体を下げた回 (two:D-79)
    sparkLabelBar=bar;
  }
  if(bar>=sparkAt){ sparkAt=-1; sparkNotes=null; sparkOff=null; }   // 取りこぼしたら捨てる
  planSpark(bar);                                    // 次を仕込む
}

/* ---- ダブ (two:D-49) を置く ----
   開始点以降を抜き、小節の終わりのオカズだけ残す */
function placeDub(bar){
  dubBar=-1;
  if(bar===dubAt && (phrase!=='break' || preChangeDub)){
    dubBar=bar; dubAt=-1;
    histPush('dubs',{});
    // 小節の頭からか、途中からか
    dubStart = Math.random()<.5 ? 0 : pick([4,6,8,10]);
    for(const k of ['kick','snare','clap','hat','ohat','hat32','perc1','perc2','rim'])
      for(let i=dubStart;i<16;i++) seq[k][i]=0;
    // 他のトラックは消しきらず、3割だけ残して薄くする
    for(const k of ['bass','lead','stab','ep','chop','arp','riff','spark'])
      for(let i=dubStart;i<16;i++) if(Math.random()>=.3) seq[k][i]=(k==='bass'||k==='lead'||k==='spark')?null:0;
    seq.fill=new Array(16).fill(null);
    pendingSpill=null;
    makeDubFill(bar);
  }
  if(bar>dubAt) dubAt=-1;   // 取りこぼしたら捨てる
  planDub(bar);             // 次を仕込む
}

/* ---- 装飾を置く ----
   **順序に意味がある。**
   1. オカズ  — seq.fill を作る
   2. リフ    — 他とぶつからない。ここは入れ替えてよい
   3. ダブ    — オカズを潰して置き直し、他のトラックも間引くので必ず最後 */
function placeDecorations(bar,fillBar){
  placeFill(bar,fillBar);
  placeSpark(bar);
  placeDub(bar);
}

function regenerate(bar){
  // 変異 (two:D-7)。当たったときだけ種を引き直し、それまでは同じ並びを繰り返す
  if(Math.random()<current.mutate*.5) reseedPattern();
  const fillBar=isFillBar(bar);
  curFillBar=fillBar;
  Object.assign(seq, buildBar(bar,sceneIdx,phrase,patSeed,fillBar));
  measureBass();
  // 音色はときどき差し替える。基本は鋸波で、たまに別の波形になる
  if(Math.random()<.25) leadType = Math.random()<.5 ? 'sawtooth' : pick(LEAD_TYPES);
  placeDecorations(bar,fillBar);
}

/* ============================================================
   第3層イベントの実行
   maybeEvent() が選んだ仕掛けを、実際に音へ効かせる。
   小節をまたぐものは「いつまで効いているか」を音声時計で持つ。
   ============================================================ */
let evFilterUntil=0, evMasterUntil=0, evDelayUntil=0, evLeadUntil=0;
let muteHatUntilBar=-1, muteKickUntilBar=-1, glitchBar=-1;

function fireEvent(id,bar,time){
  const barSec=stepDur()*16;
  switch(id){
    case 'sweep':{
      // ドラムだけを閉じてから開き直す。2小節かけて戻る
      const f=drumFilter.frequency;
      f.cancelScheduledValues(time);
      f.setValueAtTime(Math.max(400,phraseCutoff()*.06),time);
      f.exponentialRampToValueAtTime(Math.max(800,phraseCutoff()),time+barSec*2);
      drumFilter.Q.setValueAtTime(3.5,time);
      drumFilter.Q.linearRampToValueAtTime(1.0,time+barSec*2);
      evFilterUntil=time+barSec*2;
      break;
    }
    case 'masterfilter':{
      const f=mixFilter.frequency;
      f.cancelScheduledValues(time);
      f.setValueAtTime(700,time);
      f.exponentialRampToValueAtTime(20000,time+barSec*2);
      evMasterUntil=time+barSec*2;
      break;
    }
    case 'hatdrop':  muteHatUntilBar=bar+1; break;
    case 'kickdrop': muteKickUntilBar=bar+1; break;
    case 'glitch':   glitchBar=bar; break;
    case 'feedback':{
      // ディレイのフィードバックを跳ね上げ、2小節かけて戻す
      for(const tap of [delayNodes.tapL,delayNodes.tapR]){
        tap.fb.gain.cancelScheduledValues(time);
        tap.fb.gain.setValueAtTime(.86,time);
        tap.fb.gain.linearRampToValueAtTime(.4,time+barSec*2);
      }
      evDelayUntil=time+barSec*2;
      break;
    }
    case 'phaser':{
      // 4小節かけて深さを出し、そのまま引く (two:D-28)
      const w=phaserWet.gain, dep=phaserLfo.depth.gain;
      w.cancelScheduledValues(time);
      w.setValueAtTime(0,time);
      w.linearRampToValueAtTime(.55,time+barSec);
      w.setValueAtTime(.55,time+barSec*3);
      w.linearRampToValueAtTime(0,time+barSec*4);
      dep.cancelScheduledValues(time);
      dep.setValueAtTime(900,time);
      phaserLfo.osc.frequency.setValueAtTime(rand(.12,.7),time);
      break;
    }
    case 'leadsweep':{
      // シーケンスのフィルタを上げ下げする。たまにレゾナンスを上げて発振させる (two:D-29)
      const f=leadFilt.frequency, q=leadFilt.Q;
      const ring=Math.random()<.35;
      f.cancelScheduledValues(time); q.cancelScheduledValues(time);
      f.setValueAtTime(Math.max(240,leadCutoffBase()*.14),time);
      f.exponentialRampToValueAtTime(leadCutoffBase(),time+barSec*2);
      f.exponentialRampToValueAtTime(Math.max(240,leadCutoffBase()*.2),time+barSec*4);
      q.setValueAtTime(ring?18:6,time);
      q.linearRampToValueAtTime(1,time+barSec*4);
      evLeadUntil=time+barSec*4;
      break;
    }
    case 'reverse':{
      // 逆再生風の立ち上がり。次の小節の頭へ向けて膨らむ
      const n=ctx.createBufferSource(), bp=ctx.createBiquadFilter(), g=ctx.createGain();
      n.buffer=noiseBuf; n.loop=true;
      bp.type='bandpass'; bp.frequency.value=1200; bp.Q.value=.9;
      bp.frequency.linearRampToValueAtTime(5200,time+barSec);
      g.gain.setValueAtTime(.0001,time);
      g.gain.exponentialRampToValueAtTime(.22,time+barSec*.98);
      g.gain.exponentialRampToValueAtTime(.0001,time+barSec*1.02);
      n.connect(bp).connect(g).connect(drumBus);
      n.start(time); n.stop(time+barSec*1.1);
      markVoice('reverse',time,time+barSec*1.1);   // mixer に無い音。インジケーターだけ持つ (two:D-82)
      disposeAt(n,time+barSec*1.2); disposeAt(bp,time+barSec*1.2); disposeAt(g,time+barSec*1.2);
      break;
    }
  }
}

/* ============================================================
   クロック
   小節と16分ステップを ctx.currentTime 基準で進める。
   setTimeout はバックグラウンドで絞られるが、音声時計は絞られない。
   ============================================================ */
let stepIdx=0, barCount=0, nextStepTime=0, uiStep=-1, arpPos=0;
/* 小節ループ (two:D-56)。立っている間は小節の頭を処理せず、小節も進めない。
   barBuilt は再生を始めてから並びを1度でも作ったか。作る前に止めると無音の小節を繰り返してしまう */
let loopBar=false, barBuilt=false;
const uiSteps=[];   // 表示の予定。遅れて届いた分は最新だけ描く

// シーンの bpm を、BPM スライダーの中心値のぶんだけ平行移動する (two:D-11)。
// 遷移中は次のシーンの値を目標にして、ブレイクの間に寄せていく (two:D-6)
function bpmTarget(){
  const sc = pendingScene>=0 ? SCENES[pendingScene] : SCENES[sceneIdx];
  return clamp(sc.bpm + (bpmCenter-125), 100, 150);
}
let bpmCur=125;
function bpmNow(){ return bpmCur; }
function stepDur(){ return 60/bpmNow()/4; }   // 16分音符

// 入ってくるシーンのドラムだけを2本目の経路へ流す。
// ベースと和音まで重ねると音がぶつかるので、DJ が次の曲のビートを差し込むのと同じ範囲に留める
function playStepB(i,time){
  if(pendingScene<0) return;   // 遷移が打ち切られた小節の残り
  curDrumBus=drumBusB;
  kitOverride=pendingScene;
  // 途中で例外が出ても差し替えは必ず戻す。戻らないと以後の打点がすべて巻き込まれる
  try{
    if(seqB.kick[i])  bd(time,seqB.kick[i]);
    if(seqB.snare[i]) sd(time,seqB.snare[i]);
    if(seqB.clap[i])  cp(time,seqB.clap[i]);
    if(seqB.hat[i])   hh(time+rand(-.002,.003),seqB.hat[i],false);
    if(seqB.ohat[i])  hh(time,seqB.ohat[i],true);
    if(seqB.perc1[i]) perc(time,seqB.perc1[i],-.45,.2);
    if(seqB.perc2[i]) perc(time,seqB.perc2[i], .50,1.1);
  }finally{
    curDrumBus=drumBus;
    kitOverride=null;
  }
}

// 1ステップぶんの予約。並びに従ってドラムを鳴らす
function playStep(i,time){
  showStepAt(i,time);
  if(!ready) return;
  const sw=stepDur(), k=kit();
  if(seqB) playStepB(i,time);
  const hatOff  = barCount<=muteHatUntilBar;
  const kickOff = barCount<=muteKickUntilBar;
  const dubOff  = barCount===dubBar && i>=dubStart;   // ダブ (two:D-49) で抜けている間

  if(seq.kick[i]  && !kickOff) bd(time,seq.kick[i]);
  if(seq.snare[i]) sd(time,seq.snare[i]);
  if(seq.clap[i])  cp(time,seq.clap[i]);
  if(!hatOff){
    // ハットだけは打点をわずかにずらす。機械的に揃いすぎるのを避ける (two:D-7)
    if(seq.hat[i])  hh(time+rand(-.002,.003),seq.hat[i],false);
    if(seq.hat32[i]) hh(time+sw*.5+rand(-.002,.003),seq.hat32[i],false);
    if(seq.ohat[i]) hh(time,seq.ohat[i],true);
  }
  const b=seq.bass[i];
  if(b) bassNote(time,b.midi,b.steps*sw,b.vel,b.accent);
  if(seq.perc1[i]) perc(time,seq.perc1[i],-.45,.2);
  if(seq.perc2[i]) perc(time,seq.perc2[i], .50,1.1);
  if(seq.rim[i])   rim(time,seq.rim[i],rand(-.6,.6));
  if(k.cowbell && i===6 && !dubOff && Math.random()<.22) cb(time,.7);
  if(i===0 && phrase==='drop' && !dubOff) cy(time,.8);   // 戻しの頭にシンバル

  // --- 16分のシーケンス (two:D-21)
  const ld=seq.lead[i];
  if(ld) leadNote(time,ld.midi,ld.vel,Math.min(sw*1.6,.16),leadType);

  // --- オカズ (two:D-20)
  const fl=seq.fill[i];
  if(fl){
    if(fl.v==='tom') tom(time,fl.vel,fl.tone??0);
    else if(fl.v==='sd') sd(time,fl.vel);
    else if(fl.v==='cy') cy(time,fl.vel);
    // 32分の詰め
    if(fl.sub){
      if(fl.v==='tom') tom(time+sw*.5,fl.sub.vel,fl.sub.tone??0);
      else if(fl.v==='sd') sd(time+sw*.5,fl.sub.vel);
    }
  }

  // --- ハーモニー
  if(seq.stab[i]) stabHit(time,seq.stab[i]);
  if(seq.ep[i])   epChord(time,seq.ep[i]);
  // キラキラのリフ (two:D-48)
  const sp=seq.spark[i];
  if(sp) sparkNote(time,sp.midi,sp.vel,sp);   // 音価とベルの量もノートが持つ (two:D-76)
  // インダストリアル・ノイズ。小節ではなく通し番号で回すのでポリリズムになる (two:D-38)
  if(noiseOn && phrase!=='break'){
    const g0=barCount*16+i;
    for(const gen of noiseGens){
      const e=gen.pat[((g0%gen.len)+gen.len)%gen.len];
      if(e) industrialHit(time,e.vel,gen.pan);
    }
  }

  if(seq.chop[i]) chordChop(time,seq.chop[i]);
  const L=padLayers();
  if(L>=3 && seq.arp[i]){
    // アルペジオは和音の構成音を順に上る
    const tones=coreNotes(60);
    padPluck(time,tones[arpPos++%tones.length],2,'sawtooth',.22,seq.arp[i]);
  }
  if(L>=4 && seq.riff[i]){
    const tones=coreNotes(72);
    padPluck(time,tones[(i*3)%tones.length],3,'square',.16,seq.riff[i]*.8);
  }

  // グリッチ: その小節の終盤だけ32分で刻み直す (two:D-3 の C 要素)
  if(barCount===glitchBar && i>=12 && !dubOff){
    perc(time+sw*.5,.55,rand(-.6,.6),rand(.5,1.6));
    if(i===15) hh(time+sw*.75,.5,false);
  }
}

function showStepAt(idx,at){ uiSteps.push({idx,at}); }
function flushSteps(){ uiSteps.length=0; }
function runStepUI(now){
  let bestAt=-1,bestIdx=-1;
  for(let i=uiSteps.length-1;i>=0;i--){
    if(uiSteps[i].at>now) continue;
    if(uiSteps[i].at>bestAt){ bestAt=uiSteps[i].at; bestIdx=uiSteps[i].idx; }
    uiSteps.splice(i,1);
  }
  if(bestIdx>=0 && bestIdx!==uiStep){ uiStep=bestIdx; renderSteps(); }
}

// 遷移を始める。ブレイクを置き、その中でキット・和音・編成・BPM を乗り換える (two:D-5 方式1)。
// 自動の切り替えと「次へ」の両方がここを通る
function startTransition(bar,bars,time,{force=null}={}){
  newWavePeriod();
  // 行き先・方式・次のシーンの長さは Jev に聞いてあれば使う (D-8)。候補は chooseScene() と同じ範囲
  const ans=jevTake('scene',sceneStartBar);
  const byId=id=>SCENES.findIndex(s=>s.id===id);
  const nx=jevChoice(ans,'next',k=>{ const i=byId(k); return i>=0 && i!==sceneIdx && !recent.includes(i); });
  pendingScene = nx!==null ? byId(nx) : chooseScene();
  const sc=SCENES[sceneIdx], nsc=SCENES[pendingScene];
  const canMorph = nsc.group===sc.group && nsc.kit===sc.kit;
  transitionMode=forcedMode || force
    || jevChoice(ans,'mode',k=>k!=='morph' || canMorph) || chooseTransitionMode();
  jev.nextLen=jevChoice(ans,'length');
  epGuest=false;

  if(transitionMode==='break'){
    // 乗り換えの直前1小節だけをブレイクにする。それまでは今の並びのまま進む (two:D-24)
    transitionEndBar=bar+bars;
    reseedPattern();
  }else{
    // 連続変形とミックスはどちらも16小節かける。ブレイクは挟まない
    transitionEndBar=bar+PHRASE_BARS;
    if(transitionMode==='mix'){
      patSeedB=(Math.random()*1e9)|0;
      seqB=null;
      scheduleMixFades(bar,time);
    }
  }
  jevAskHarmony(transitionMode);   // 行き先のキーと進行 (D-8)。乗り換えまでに届けば使う
  showProgress();
}

// 方式の選び方 (two:D-5)。連続変形は、離散的な入れ替わりが起きない相手にだけ使う。
// 回路もキットも同じなら、値を滑らかに移すだけで乗り換えが成立する
function chooseTransitionMode(){
  const sc=SCENES[sceneIdx], nx=SCENES[pendingScene];
  const canMorph = nx.group===sc.group && nx.kit===sc.kit;
  const r=Math.random();
  if(canMorph && r<.35) return 'morph';
  return r<.7 ? 'mix' : 'break';
}

// ミックスの音量とフィルタを予約する。
// 入ってくる側はハイパスを下げながら量を上げ、出ていく側は後半で引く
function scheduleMixFades(bar,time){
  if(!drumMixB) return;
  const barSec=stepDur()*16, span=barSec*PHRASE_BARS;
  drumMixB.gain.cancelScheduledValues(time);
  drumMixB.gain.setValueAtTime(.0001,time);
  drumMixB.gain.linearRampToValueAtTime(1,time+span*.85);
  drumFilterB.frequency.cancelScheduledValues(time);
  drumFilterB.frequency.setValueAtTime(1400,time);
  drumFilterB.frequency.exponentialRampToValueAtTime(28,time+span*.8);
  drumMix.gain.cancelScheduledValues(time);
  drumMix.gain.setValueAtTime(1,time);
  drumMix.gain.setValueAtTime(1,time+span*.4);
  drumMix.gain.linearRampToValueAtTime(.0001,time+span);
}
// 乗り換えが済んだら経路を元に戻す
function endMixFades(time){
  if(!drumMixB) return;
  for(const [g,v] of [[drumMix.gain,1],[drumMixB.gain,.0001]]){
    g.cancelScheduledValues(time); g.setValueAtTime(v,time);
  }
  drumFilterB.frequency.cancelScheduledValues(time);
  drumFilterB.frequency.setValueAtTime(1400,time);
  seqB=null;
}

/* ============================================================
   Jev (D-4〜D-8)
   ------------------------------------------------------------
   音楽的な判断を、中継の Worker (worker/, D-3) 経由で Jev に問い合わせる。
   onBar() は小節の約0.12秒前に同期で走るので、その場では応答を待てない。
   planSpark / planDub と同じく「数小節先の判断を先に問い合わせ、その小節で使う。
   間に合わなければ捨てて、two と同じ手元の判断に戻る」形にする (D-4)。
   jev スライダーは判断のうち Jev に任せる割合。0 なら two と同じに鳴る (D-5)
   ============================================================ */
const JEV_OFF = QS.get('jev')==='0';
const JEV_LOG = QS.has('jevlog');
// 手元で開いたときは手元の wrangler dev に向ける。試験が本番の Worker を叩かないため
const JEV_URL = QS.get('jevurl')
  || (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:8787/decide'
                                                          : 'https://three-api.elevator-noise.com/decide');
const JEV_FAILS=3, JEV_PAUSE=32;   // 続けて3回失敗したら32小節は問い合わせない
const jev={status:JEV_OFF?'off':'local', ms:null, fails:0, pauseUntil:-1,
           used:0, local:0, last:'', book:{}, inflight:{}, nextLen:null, nextLush:false};
const jevLog=(...a)=>{ if(JEV_LOG) console.log('[jev]',...a); };
const jevInfl=()=>JEV_OFF ? 0 : current.jev;
/* 問い合わせるかどうかは目標値 (target) で決める。current は目標へ滑らかに寄せる値で、
   0 に近づくだけで 0 にならないので、0 にしても問い合わせが続いてしまう (D-12) */
const jevActive=()=>!JEV_OFF && target.jev>0 && running && barCount>=jev.pauseUntil;

/* 出来事の記録。Jev に「いままで何が起きてきたか」を渡すため (D-6)。
   種類ごとに直近の8件だけを持つ */
const hist={scenes:[], phrases:[], events:[], dubs:[], riffs:[], keys:[]};
function histPush(k,v){
  const a=hist[k];
  a.push({bar:barCount,...v});
  if(a.length>8) a.shift();
}
const keyName=pc=>`${NOTE_NAMES[((pc%12)+12)%12]} ${MODE_LABEL[SCENES[sceneIdx].group]}`;
const DEG_NAME=['I','bII','II','bIII','III','IV','#IV','V','bVI','VI','bVII','VII'];

function jevState(extra){
  const sc=SCENES[sceneIdx];
  const r2=v=>Math.round(v*100)/100;
  return {
    bar:barCount, bpm:Math.round(bpmNow()),
    scene:{id:sc.id, group:GROUP_LABEL[sc.group], character:SCENE_DESC[sc.id],
           barsIn:barCount-sceneStartBar, plannedBars:sceneBars},
    phrase:{now:phrase, barsIn:barCount-phraseStartBar},
    darkBright:{now:r2(waveYY(wavePos)), heading:(wavePos%1)<.5 ? 'brighter' : 'darker'},
    key:keyName(tonic()),
    chord:`${DEG_NAME[chordDeg%12]} ${chordQual}`,
    controls:{density:r2(current.density), glitch:r2(current.glitch), evolution:r2(current.evolution)},
    history:hist,
    ...extra,
  };
}

/* ---- やり取りのログ (D-11) ----
   問い合わせ1回を1件とし、問い・答え・使ったものを monitor に出す。
   答えの answers から件を引けるようにしておき、jevChoice / jevP が使ったものを書き足す */
const JEV_LOG_MAX=5;
const jevEntries=[], ansEntry=new WeakMap();
const pct=p=>Math.round(p*100)+'%';
function fmtAsk(ask){
  return Object.entries(ask).map(([q,o])=>o===true ? q+'?' : `${q}(${Object.keys(o).length})`).join(' ');
}
function fmtAnswers(ans){
  return Object.entries(ans).map(([q,a])=>{
    if(!a.probs) return `${q} ${pct(a.p)}`;
    const top=Object.entries(a.probs).sort((x,y)=>y[1]-x[1]).slice(0,3);
    return q+' '+top.map(([k,p])=>`${k} ${pct(p)}`).join(' / ');
  }).join(' · ') || '(no answer)';
}
function renderJevLog(){
  const el=document.getElementById('jevlog');
  if(!el) return;
  if(JEV_OFF){ el.textContent='jev off — nothing is asked'; return; }
  el.replaceChildren(...jevEntries.map(e=>{
    const box=document.createElement('div'); box.className='e';
    const line=(cls,text)=>{ const d=document.createElement('div'); if(cls) d.className=cls; d.textContent=text; box.appendChild(d); };
    line('',`bar ${e.bar} ${e.name} → by ${e.deadline}  ${fmtAsk(e.ask)}  [${e.ctx}]`);
    line(e.status==='ok' ? 'a' : e.status==='waiting' ? '' : 'x',
      e.status==='waiting' ? '… waiting'
      : e.status==='ok'     ? `← ${e.ms}ms  ${fmtAnswers(e.answers)}`
      : e.status==='late'   ? `← ${e.ms}ms  late, discarded`
      : e.status==='stale'  ? `← ${e.ms}ms  ${fmtAnswers(e.answers)}  (not used: moment passed)`
      :                       `✕ ${e.error}`);
    if(e.used.length) line('u','used  '+e.used.join(' · '));
    box.title=JSON.stringify({ask:e.ask, answers:e.answers}, null, 1).slice(0,3000);
    return box;
  }));
}
function jevEntry(name,deadline,ask,state){
  const e={bar:barCount, name, deadline, ask, status:'waiting', ms:null, answers:null, used:[], error:'',
           ctx:`${state.scene.id} ${state.phrase.now} ${state.key}`};
  jevEntries.unshift(e);
  if(jevEntries.length>JEV_LOG_MAX) jevEntries.pop();
  renderJevLog();
  return e;
}
// 使ったものを書き足す。local は、答えはあったが割合で手元の判断に回したもの
function jevUsed(ans,text){
  const e=ans && ansEntry.get(ans);
  if(!e) return;
  e.used.push(text);
  renderJevLog();
}

/* 問い合わせる。name は予約の名前、tag はその判断を使う場面 (小節など)。
   deadline の小節の onBar() より後に届いた応答は捨てる。onAnswer は届いたときに呼ぶ */
function jevAsk(name,kind,{tag,deadline,ask,extra,onAnswer}){
  if(!jevActive() || jev.inflight[name] || barCount>=deadline) return false;
  const budget=Math.max(250,(deadline-barCount-.5)*stepDur()*16*1000);
  const ac=new AbortController();
  const timer=setTimeout(()=>ac.abort(),budget);
  const t0=performance.now();
  jev.inflight[name]=true;
  const state=jevState(extra);
  const entry=jevEntry(name,deadline,ask,state);
  fetch(JEV_URL,{method:'POST', headers:{'Content-Type':'application/json'},
                 body:JSON.stringify({kind, state, ask}), signal:ac.signal})
    .then(r=>r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status)))
    .then(d=>{
      jev.ms=Math.round(performance.now()-t0); jev.fails=0; jev.status='on';
      entry.ms=jev.ms;
      if(barCount>=deadline){ entry.status='late'; renderJevLog(); jevLog('late',name,jev.ms+'ms'); return; }
      const answers=(d && d.answers) || {};
      entry.status='ok'; entry.answers=answers; ansEntry.set(answers,entry);
      renderJevLog();
      jev.book[name]={tag, answers};
      jevLog(name,'@'+tag,jev.ms+'ms',answers);
      if(onAnswer) onAnswer(answers);
    })
    .catch(e=>{
      jev.fails++; jev.status='offline';
      entry.status='failed';
      entry.error = e && e.name==='AbortError' ? 'no answer in time' : String(e && e.message || e);
      renderJevLog();
      if(jev.fails>=JEV_FAILS) jev.pauseUntil=barCount+JEV_PAUSE;
      jevLog('failed',name,String(e));
    })
    .finally(()=>{ clearTimeout(timer); jev.inflight[name]=false; });
  return true;
}
// 予約した応答を取り出す。まだ先の場面のものは残し、過ぎた場面のものは捨てる
function jevTake(name,tag){
  const b=jev.book[name];
  if(!b || b.tag>tag) return null;
  delete jev.book[name];
  if(b.tag===tag) return b.answers;
  const e=ansEntry.get(b.answers);
  if(e){ e.status='stale'; renderJevLog(); }
  return null;
}
let jevNow={};   // この小節で使う応答。onBar() の頭で取り出す

function sampleProbs(probs,allowed){
  const ks=Object.keys(probs).filter(k=>probs[k]>0 && allowed(k));
  let sum=0; for(const k of ks) sum+=probs[k];
  if(sum<=0) return null;
  let r=Math.random()*sum;
  for(const k of ks){ r-=probs[k]; if(r<=0) return k; }
  return ks[ks.length-1];
}
/* 選択肢を引く。**最大確率を取らず、Jev の分布からサンプリングする** (D-5)。
   jev スライダーの割合だけ Jev の分布から、残りは呼び手が手元で引く (null を返す)。
   分布の混ぜ合わせと同じなので、スライダーを下げるほど two に近づく */
function jevChoice(ans,qid,allowed=()=>true,{always=false}={}){
  const a=ans && ans[qid];
  const k = (a && a.probs && (always || Math.random()<jevInfl())) ? sampleProbs(a.probs,allowed) : null;
  if(k===null){
    jev.local++;
    if(a && a.probs) jevUsed(ans,`${qid} → local`);
    return null;
  }
  jev.used++;
  jev.last=`${qid} ${k} ${Math.round(a.probs[k]*100)}%`;
  // リフは記号 (r0〜r5) では分からないので旋律を添える
  const e=ansEntry.get(ans);
  const desc = qid==='riff' && e ? ' '+e.ask.riff[k] : '';
  jevUsed(ans,`${qid} ${k}${desc}`);
  return k;
}
/* 真偽の問いの確率。gate は、スライダー (shift / lush) を 0 にしたら出さないという約束を
   Jev の側でも守るための倍率 */
function jevP(ans,qid,localP,gate=1){
  const a=ans && ans[qid];
  if(!a || typeof a.p!=='number' || Math.random()>=jevInfl()){
    jev.local++;
    if(a && typeof a.p==='number') jevUsed(ans,`${qid} → local`);
    return localP;
  }
  jev.used++;
  jev.last=`${qid} ${Math.round(a.p*100)}%`;
  jevUsed(ans,`${qid} p=${pct(clamp(a.p*gate))}`);
  return clamp(a.p*gate);
}

/* ---- 問い合わせの予定 (D-7) ----
   onBar() の頭で呼ぶ。問い合わせる小節と、使う小節は次のとおり
   - scene  : 遷移を始めうる最初の小節の8小節前 → startTransition()
   - harm   : 遷移を始めたとき → enterScene() (キーと進行)
   - phrase : 4小節の節目の2小節前 → maybeEvent() / nextPhrase() / planDub()
   - shift  : 8小節の節目の2小節前 → 平行移動の転調 / nextPhrase() の lush
   - riff   : planSpark() が新しい旋律を引いたとき → placeSpark() */
const PHRASE_DESC={
  plateau:'Hold the groove steady; little changes',
  build:'Accumulate layers and tension',
  break:'A one-bar break with most parts out',
  drop:'Strip back and let the groove hit again',
  dubout:'Dub out: sparse, space and delays',
};
const EVENT_DESC={
  none:'No event; let the groove run',
  sweep:'The drums close down through a filter and open again over two bars',
  masterfilter:'The whole mix closes through a filter and reopens',
  hatdrop:'The hats drop out for a bar',
  kickdrop:'The kick drops out for a bar',
  glitch:'A glitch stutter chops the bar',
  feedback:'The delay feedback surges and settles over two bars',
  reverse:'A reverse noise swell rises into the next bar',
  phaser:'A phaser sweeps across the mix over four bars',
  leadsweep:'The 16th-note sequence filter sweeps open',
};
const MODE_DESC={
  break:'Run into a one-bar break; the new scene lands after it',
  mix:'A DJ-style blend: both drum tracks overlap for 16 bars',
  morph:'A continuous 16-bar morph of every parameter, no seam',
};
const LEN_DESC={short:'Shorter than usual (about 2 minutes)', medium:'The usual length (about 3 minutes)', long:'Longer than usual (about 4-5 minutes)'};
const LEN_MUL={short:.7, medium:1, long:1.35};
const KEY_STEP_DESC={0:'stay in the same key', 5:'up a fourth', 7:'up a fifth', 2:'up a whole tone',
                     3:'up a minor third', 9:'down a minor third', 4:'up a major third', 8:'down a major third'};

// chooseScene() と同じ候補。波に近い順で、直近に出たものといまのシーンを除く
function sceneCandidates(n){
  const yy=waveYY(wavePos);
  return SCENES.map((s,i)=>({i,d:Math.abs(s.yy-yy)}))
    .filter(c=>c.i!==sceneIdx && !recent.includes(c.i))
    .sort((a,b)=>a.d-b.d).slice(0,n).map(c=>c.i);
}
const sceneOpt=i=>{
  const s=SCENES[i];
  return `${GROUP_LABEL[s.group]}, ${s.kit} kit, ${s.bpm} BPM, dark-bright ${s.yy.toFixed(2)}. ${SCENE_DESC[s.id]}`;
};

function jevPlan(bar){
  if(!jevActive()) return;
  // シーン。遷移を始めうる最初の小節 (onBar の条件) の8小節前から問い合わせる
  const earliest=sceneStartBar+sceneBars-TRANSITION_BARS;
  if(pendingScene<0 && jev.sceneAsked!==sceneStartBar && bar>=earliest-8 && bar<earliest){
    const next={};
    for(const i of sceneCandidates(6)) next[SCENES[i].id]=sceneOpt(i);
    if(Object.keys(next).length>=2 &&
       jevAsk('scene','scene',{tag:sceneStartBar, deadline:earliest,
         ask:{next, mode:MODE_DESC, length:LEN_DESC}}))
      jev.sceneAsked=sceneStartBar;
  }
  // 4小節の節目の2小節前。イベントと、節目が8小節目ならフレーズとダブも
  const at=bar+2;
  if(at%4===0 && pendingScene<0){
    const ask={event:EVENT_DESC};
    const inPhrase=at-phraseStartBar;
    if(phraseLen>BREAK_BARS && inPhrase>=8 && inPhrase%8===0){
      const w=SCENES[sceneIdx].w, ph={};
      for(const k of PHRASES) if((w[k]||0)>0) ph[k]=PHRASE_DESC[k];
      if(Object.keys(ph).length>=2) ask.phrase=ph;
    }
    if(at%8===0 && forcedDub===null) ask.dub=true;
    jevAsk('phrase','phrase',{tag:at, deadline:at, ask});
  }
  // 8小節の節目の2小節前。平行移動の転調と開いた和声
  if((at-phraseStartBar)%8===0 && pendingScene<0 && (current.shift>0 || current.lush>0)){
    const ask={};
    if(current.shift>0) ask.shift=true;
    if(current.lush>0 && (circuit()==='jazz' || circuit()==='sustain')) ask.lush=true;
    if(Object.keys(ask).length)
      jevAsk('shift','harmony',{tag:at, deadline:at, ask});
  }
}

// 遷移を始めたときに、行き先のキーと進行を問い合わせる。連続変形では調を持ち越すので進行だけ
function jevAskHarmony(mode){
  const g=SCENES[pendingScene].group;
  const lushOk=(g==='jazz' || g==='sustain');
  jev.nextLush = lushOk && Math.random()<current.lush;
  const list = jev.nextLush ? LUSH_PROGS[g] : PROGS[g];
  const prog={};
  list.forEach((pr,i)=>{
    prog['p'+i]=pr.map(([d,q,b])=>DEG_NAME[d]+' '+q+(b!=null?'/'+DEG_NAME[b]:'')).join(' - ');
  });
  const ask={prog};
  if(mode!=='morph'){
    const steps=[5,7,0,2].concat(current.shift>0 ? [3,9,4,8] : []);
    const key={};
    for(const s of steps) key[NOTE_NAMES[(keyPc+s)%12]]=`${NOTE_NAMES[(keyPc+s)%12]} ${MODE_LABEL[g]}: ${KEY_STEP_DESC[s]} from ${NOTE_NAMES[keyPc]}`;
    ask.key=key;
  }
  jevAsk('harm','harmony',{tag:transitionEndBar, deadline:transitionEndBar, ask,
    extra:{nextScene:{id:SCENES[pendingScene].id, group:GROUP_LABEL[g], character:SCENE_DESC[SCENES[pendingScene].id]}}});
}

// 小節の頭で3階層を進める。ここが進行の中心。
// フレーズとシーンを先に決めてから並びを引き直す (両者が並びの前提になるため)
function onBar(bar,time){
  jevNow={phrase:jevTake('phrase',bar), shift:jevTake('shift',bar)};
  // ---- シーン遷移 (two:D-5 方式1: ブレイクを挟む) ----
  // 終わりの8小節をブレイクに充て、その間にキット・和音・編成・BPM を乗り換える
  if(pendingScene<0 && bar-sceneStartBar>=sceneBars-TRANSITION_BARS && (bar-phraseStartBar)%8===0){
    startTransition(bar,TRANSITION_BARS,time);
  }
  // 乗り換え前の小節 (two:D-62)。ダブかオカズで合図する。ダブを引いたらブレイクの代わりにする
  preChangeDub=false;
  if(pendingScene>=0 && bar===transitionEndBar-1){
    const p = forcedDub!==null ? forcedDub : PRECHANGE_DUB_P;
    if(Math.random()<p){ preChangeDub=true; dubAt=bar; }
  }
  // ブレイク方式の遷移では、終わりの1小節だけ音を抜く
  if(pendingScene>=0 && transitionMode==='break' && bar===transitionEndBar-1 && phrase!=='break' && !preChangeDub){
    phrase='break'; phraseStartBar=bar; phraseLen=BREAK_BARS;
    reseedPattern();
  }
  if(pendingScene>=0 && bar>=transitionEndBar){
    const nxt=pendingScene, mode=transitionMode;
    pendingScene=-1;
    if(mode==='mix') endMixFades(time);
    // 連続変形では調も持ち越す。ここで転調すると継ぎ目が出てしまう
    enterScene(nxt,{keepKey:mode==='morph'});
    if(mode!=='morph') nextPhrase();
  }
  // フレーズは16小節がひと区切り。「展開」を上げると、8小節の折り返しでも
  // 切り替わることがあり、移り変わりが早くなる (two:D-11)
  const inPhrase=bar-phraseStartBar;
  const early = phraseLen>BREAK_BARS && inPhrase>=8 && inPhrase%8===0
                && Math.random()<current.evolution*.4;
  if((inPhrase>=phraseLen || early) && pendingScene<0) nextPhrase();
  // 平行移動の転調 (two:D-65)。8小節の節目で、形を保ったまま根音をずらす。遷移中は動かさない。
  // ずらしたら、進行の位置はそのままに和音を組み直す
  if(pendingScene<0 && bar>0 && (bar-phraseStartBar)%8===0
     && Math.random()<jevP(jevNow.shift,'shift',current.shift,Math.min(1,current.shift/.5))){
    shiftOff = (shiftOff!==0 && Math.random()<.5) ? 0 : wrapShift(shiftOff+pick(SHIFT_STEPS));
    chordRevoice=true;
    histPush('keys',{key:keyName(tonic()), shift:true});
  }
  // 和音を進める。間隔は回路ごとに違い、スタブはほとんど動かない (two:D-9)
  if(bar-chordAt>=chordBars()){
    // シーンに入った直後は進行の1つ目から始める。そこで進めると頭を飛ばしてしまう
    if(chordAt>-900){
      // ペダル (two:D-65)。和音が変わっても、ベースだけ前の根音に1小節留める (two:D-67 で2から半分に)
      if(Math.random()<current.shift*.5){ pedalPc=(tonic()+chordDeg)%12; pedalUntilBar=bar+1; }
      progPos++;
    }
    setChord(); chordAt=bar;
    padRebuild(time);
  }else if(chordRevoice){
    padRebuild(time);   // 和音は同じ度数のまま、動いた調で組み直す
  }
  chordRevoice=false;
  regenerate(bar);
  if(bar===dubBar) fireDub(time);   // ダブ (two:D-49)。音の側の仕掛けはここから
  // DJ ミックス風の遷移では、同じ小節に対して新シーンぶんの並びも作る (two:D-5 方式3)
  seqB = (pendingScene>=0 && transitionMode==='mix')
    ? buildBar(bar,pendingScene,'plateau',patSeedB,false) : null;
  if(bar>0 && bar%4===0) maybeEvent(bar,time);   // 開始直後の1小節目にいきなり仕掛けを出さない
  jevPlan(bar);   // 数小節先の判断を問い合わせておく (D-7)
  showProgress();
}

function seqTick(){
  const now=ctx.currentTime;
  const ahead=.12;   // 先読み。これより先の予約はしない
  while(nextStepTime < now+ahead){
    const hold = loopBar && barBuilt;
    if(stepIdx===0 && !hold){ onBar(barCount,nextStepTime); barBuilt=true; }
    playStep(stepIdx,nextStepTime);
    nextStepTime += stepDur();
    stepIdx++;
    if(stepIdx>=16){ stepIdx=0; if(!(loopBar && barBuilt)) barCount++; }
  }
}

/* ============================================================
   平滑化ループ
   ============================================================ */
let last=performance.now(), smoothAt=0;
function smooth(){
  const now=performance.now();
  const dt=Math.min(.5,(now-last)/1000); last=now;   // 復帰直後の巨大なdtで値が飛ばないように抑える
  smoothAt=now;
  const tau=Math.max(1,glide)/3;
  const k=1-Math.exp(-dt/tau);
  for(const key in P) current[key]+=(target[key]-current[key])*k;
  // BPM は推移時間とは別に、常に一定の速さで寄せる。急に変わると拍が飛ぶ
  bpmCur += (bpmTarget()-bpmCur)*(1-Math.exp(-dt/6));

  // 波を進め、手で触られていない限り陰陽の目標を波に従わせる (two:D-13)
  if(running && !dragging){
    wavePos=(wavePos+dt/wavePeriod)%1;
    // 連続変形の最中は、行き先のシーンの陰陽へまっすぐ寄せる (two:D-5 方式2)
    const goal = (pendingScene>=0 && transitionMode==='morph')
      ? SCENES[pendingScene].yy : waveYY(wavePos);
    if(!sceneEdited) target.yy=lerp(target.yy, goal, Math.min(1,dt*.5));
  }
  apply();
  readout();
}
// 音声時計が止まっている間 (発音前、AudioContextの中断中) の受け皿
setInterval(()=>{ if(performance.now()-smoothAt>=250) smooth(); }, 100);

   XYパッドの跡地に、すべてのスライダーを並べる。群は control / mixer の2つと monitor で、

// 群を作り、列を並べる本体を返す。置き場所を指定しなければ卓の末尾に足す
function mixGroup(title,host=mixerEl,before=null){

// def は reset all で戻す値。関数ならその時点で引く
function addSlider(host,{id,label,tip,min,max,step,value,def=value,fmt,onInput}){
  const wrap=document.createElement('div'); wrap.className='param';
  const lab=document.createElement('label'); lab.htmlFor='s_'+id;
  const name=document.createElement('span'); name.textContent=label;
  if(tip) name.dataset.tip=tip;
  const val=document.createElement('span'); val.className='val'; val.id='v_'+id;
  lab.append(name,val);
  const r=document.createElement('input');
  r.type='range'; r.min=min; r.max=max; r.step=step; r.value=value; r.id='s_'+id;
  r.show=()=>{ val.textContent=fmt(parseFloat(r.value)); };
  r.addEventListener('input',()=>{ onInput(parseFloat(r.value)); r.show(); });
  wrap.append(lab,r); host.appendChild(wrap);
  r.show();
  sliders.push({r,def,onInput});
  return r;
}

  if(d.ratio) return;   // 倍率には SOLO / MUTE の意味が無い (two:D-59)。発音も無いのでインジケーターも付けない
  addLed(r.previousElementSibling,key);   // label の中、名前の直後 (two:D-82)
  // スライダーと同じ行に並べる。label の中に入れるとボタンが入れ子になる

  row.append(r, btn('solo','S','Solo. While any part is soloed, only soloed parts are heard.'),

}
